          ctx.lineTo(rotHandle.x, rotHandle.y);
          ctx.strokeStyle = boxColor;
          ctx.lineWidth = 1.75;
          ctx.stroke();

          ctx.fillStyle = '#FFFFFF';
          ctx.strokeStyle = boxColor;
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(rotHandle.x, rotHandle.y, 6, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          // 8 Resize Handles
          getResizeHandles(b).forEach((h) => {
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = boxColor;
            ctx.lineWidth = 2;
            ctx.fillRect(h.x - 5.5, h.y - 5.5, 11, 11);
            ctx.strokeRect(h.x - 5.5, h.y - 5.5, 11, 11);
          });

          // Bezier anchors/handles for single selected bezier object
          if (editableSelectedObj?.kind === 'bezier' && editableSelectedObj.nodes) {
            editableSelectedObj.nodes.forEach((n) => {
              ctx.strokeStyle = '#EC4899';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(n.hIn.x, n.hIn.y);
              ctx.lineTo(n.x, n.y);
              ctx.lineTo(n.hOut.x, n.hOut.y);
              ctx.stroke();

              [n.hIn, n.hOut].forEach((h) => {
                ctx.fillStyle = '#EC4899';
                ctx.beginPath();
                ctx.arc(h.x, h.y, 4.5, 0, Math.PI * 2);
                ctx.fill();
              });

              ctx.fillStyle = '#EEF2FF';
              ctx.strokeStyle = '#4F46E5';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.arc(n.x, n.y, 5.5, 0, Math.PI * 2);
              ctx.fill();
              ctx.stroke();
            });
          }
          ctx.restore();
        }

        // Marquee Drag Selection Box
        if (tool === 'select' && marqueeBox) {
          const w = marqueeBox.maxX - marqueeBox.minX;
          const h = marqueeBox.maxY - marqueeBox.minY;
          if (w > 1 || h > 1) {
            ctx.save();
            ctx.fillStyle = 'rgba(37, 99, 235, 0.12)';
            ctx.strokeStyle = '#2563EB';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([5, 3]);
            ctx.fillRect(marqueeBox.minX, marqueeBox.minY, w, h);
            ctx.strokeRect(marqueeBox.minX, marqueeBox.minY, w, h);
            ctx.restore();
          }
        }
      }, [
        drawnObjects,
        activeBezierNodes,
        hoverCanvasPt,
        blackStrokeWidth,
        drawStyleMode,
        drawInsertPos,
        strokeColor,
        fillColor,
        resolveSolidStroke,
        resolveSolidFill,
        tool,
        editableSelectedObj,
        editableSelectedObjs,
        marqueeBox,
        guideOpacity,
        customGuideDataUrl,
      ]);

      // ========================================================================
      // SVG GENERATION & EXPORT HELPERS
      // ========================================================================
      const isStudioBlank = () =>
        drawnObjects.filter((o) => !o.isBaseLayer && o.visible !== false).length === 0 &&
        activeBezierNodes.length === 0;

      const renderVectorObjToSvg = useCallback(
        (obj, indent = '    ', ignoreHidden = true, includeBase = true) => {
          if (!obj) return '';
          if (ignoreHidden && obj.visible === false) return '';
          if (obj.kind === 'base-clothes') {
            return includeBase ? `${indent}${BASE_CLOTHES_INNER_SVG}\n` : '';
          }
          if (obj.kind === 'base-face') {
            return includeBase ? `${indent}${BASE_FACE_INNER_SVG}\n` : '';
          }
          if (obj.kind === 'group' && obj.children) {
            const childrenSvg = obj.children
              .map((ch) =>
                renderVectorObjToSvg(ch, `${indent}  `, ignoreHidden, includeBase)
              )
              .join('');
            return `${indent}<g id="${obj.id}">\n${childrenSvg}${indent}</g>\n`;
          }
          const d =
            obj.kind === 'bezier'
              ? bezierNodesToSvgPath(obj.nodes, Boolean(obj.closed))
              : pointsToSvgPath(obj.points, Boolean(obj.closed));
          const fillAttr =
            obj.fillColor && obj.fillColor !== 'none' ? obj.fillColor : 'none';
          const strokeAttr =
            obj.strokeColor && obj.strokeColor !== 'none' ? obj.strokeColor : 'none';
          return `${indent}<path d="${d}" fill="${fillAttr}" stroke="${strokeAttr}" stroke-width="${obj.strokeWidth}" stroke-linecap="round" stroke-linejoin="round" />\n`;
        },
        []
      );

      const renderLayerThumbnailSvg = useCallback(
        (obj) => wrapSvgScreen(renderVectorObjToSvg(obj, '  ', false, true)),
        [renderVectorObjToSvg]
      );

      const generateDrawnSvgString = useCallback(
        (includeBase = false) => {
          const activeBezierObj =
            activeBezierNodes.length > 0
              ? {
                  kind: 'bezier',
                  nodes: activeBezierNodes,
                  strokeColor:
                    drawStyleMode === 'fill' ? 'none' : resolveSolidStroke(strokeColor),
                  strokeWidth: blackStrokeWidth,
                  fillColor:
                    drawStyleMode === 'stroke' ? 'none' : resolveSolidFill(fillColor),
                  closed: false,
                  visible: true,
                }
              : null;

          const allObjs = activeBezierObj
            ? insertNewUserObject(drawnObjects, activeBezierObj)
            : drawnObjects;

          const inner = allObjs
            .map((obj) => renderVectorObjToSvg(obj, '    ', true, includeBase))
            .join('');
          return wrapSvg51x48(`  <g id="custom-drawn-item">\n${inner}  </g>`);
        },
        [
          drawnObjects,
          activeBezierNodes,
          blackStrokeWidth,
          drawStyleMode,
          strokeColor,
          fillColor,
          resolveSolidStroke,
          resolveSolidFill,
          insertNewUserObject,
          renderVectorObjToSvg,
        ]
      );

      const extractInnerSvg = (svgStr) => {
        if (!svgStr) return '';
        const cleanedSvg = svgStr.replace(
          /\s*vector-effect\s*=\s*["']non-scaling-stroke["']/gi,
          ''
        );
        const match = cleanedSvg.match(/<svg([^>]*)>([\s\S]*?)<\/svg>/i);
        if (!match) return cleanedSvg;

        const attrs = match[1] || '';
        const inner = match[2] || '';

        const vbMatch = attrs.match(/viewBox\s*=\s*["']([^"']+)["']/i);
        if (vbMatch && vbMatch[1].trim() !== VIEWBOX) {
          return `<svg viewBox="${vbMatch[1].trim()}" x="0" y="0" width="${CANVAS_W}" height="${CANVAS_H}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
        }

        if (!vbMatch) {
          const wMatch = attrs.match(/width\s*=\s*["']([0-9.]+)(px)?["']/i);
          const hMatch = attrs.match(/height\s*=\s*["']([0-9.]+)(px)?["']/i);
          if (wMatch && hMatch) {
            const w = parseFloat(wMatch[1]);
            const h = parseFloat(hMatch[1]);
            if (w > 0 && h > 0 && (w !== CANVAS_W || h !== CANVAS_H)) {
              return `<svg viewBox="0 0 ${w} ${h}" x="0" y="0" width="${CANVAS_W}" height="${CANVAS_H}" preserveAspectRatio="xMidYMid meet">${inner}</svg>`;
            }
          }
        }
        return inner;
      };

      const toScreenSvg = (svgStr) => wrapSvgScreen(extractInnerSvg(svgStr));
      const toPixelSvg = (svgStr) => wrapSvgPixel(extractInnerSvg(svgStr));

      const getEquippedItemObj = (slot) => {
        const id = equipped[slot];
        if (!id) return null;
        return items.find((it) => it.id === id) || null;
      };

      const handleSaveDrawnItem = () => {
        if (isStudioBlank()) {
          notify('먼저 캔버스 위에 아이템을 그려주세요!');
          return;
        }
        const svgStr = generateDrawnSvgString();
        const targetCat = saveCategory === 'custom' ? 'hat' : saveCategory;
        const newItem = {
          id: `custom-${Date.now()}`,
          category: targetCat,
          name: newItemName.trim() || '내 커스텀 파츠',
          svg: svgStr,
          isCustom: true,
        };

        setItems((prev) => [newItem, ...prev]);
        setEquipped((prev) => ({ ...prev, [targetCat]: newItem.id }));
        setLayerVisible((prev) => ({ ...prev, [targetCat]: true }));
        handleClearCanvas();
        notify(`'${newItem.name}' 파츠가 완성 프로필에 장착되었습니다!`);
      };

      const downloadBlob = (blob, filename) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const buildCombinedProfileInnerSvg = (includeLiveCanvas = true) => {
        let content = '';
        if (previewBgColor !== 'transparent') {
          content += `\n  <rect x="0" y="0" width="${CANVAS_W}" height="${CANVAS_H}" rx="20" fill="${previewBgColor}" />`;
        }

        const shouldShowBase = layerVisible.base && includeBaseOnExport;

        // Custom uploaded base image (if any) sits at bottom
        if (shouldShowBase && customGuideDataUrl && equipped.base === 'base-default') {
          content += `\n  <image x="0" y="0" width="${CANVAS_W}" height="${CANVAS_H}" preserveAspectRatio="xMidYBottom meet" href="${customGuideDataUrl}" />`;
        }

        // Unified canvas layer stack (preserves exact z-order: e.g. back hair < base clothes < base face < front hair)
        if (includeLiveCanvas) {
          const includeBuiltInBase =
            shouldShowBase && !customGuideDataUrl && equipped.base === 'base-default';
          content += `\n  <g id="layer-live-canvas">${extractInnerSvg(
            generateDrawnSvgString(includeBuiltInBase)
          )}</g>`;
        } else if (shouldShowBase && !customGuideDataUrl) {
          const itemObj = getEquippedItemObj('base');
          if (itemObj) {
            content += `\n  <g id="layer-base">${extractInnerSvg(itemObj.svg)}</g>`;
          }
        }

        // Equipped overlay parts
        LAYER_STACK_ORDER.filter((slot) => slot !== 'base').forEach((slot) => {
          if (!layerVisible[slot]) return;
          const itemObj = getEquippedItemObj(slot);
          if (itemObj) {
            content += `\n  <g id="layer-${slot}">${extractInnerSvg(itemObj.svg)}</g>`;
          }
        });

        return content;
      };

      const exportFullProfileSVG = () => {
        const svg = wrapSvg51x48(buildCombinedProfileInnerSvg(true));
        const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        downloadBlob(blob, 'makemate-profile_51x48mm.svg');
        notify('완성 프로필이 51×48mm SVG로 저장되었습니다!');
      };

      const exportFullProfilePNG = () => {
        const pixelSvg = wrapSvgPixel(buildCombinedProfileInnerSvg(true));
        const blob = new Blob([pixelSvg], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const out = document.createElement('canvas');
          out.width = CANVAS_W * 2;
          out.height = CANVAS_H * 2;
          const ctx = out.getContext('2d');
          ctx.drawImage(img, 0, 0, out.width, out.height);
          URL.revokeObjectURL(url);
          out.toBlob((pngBlob) => {
            if (pngBlob) {
              downloadBlob(pngBlob, 'makemate-profile_51x48mm.png');
              notify('완성 프로필이 고해상도 PNG로 저장되었습니다!');
            }
          }, 'image/png');
        };
        img.src = url;
      };

      const exportLiveCanvasOnlySVG = () => {
        if (isStudioBlank()) {
          notify('캔버스에 그려진 그림이 없습니다.');
          return;
        }
        const svg = generateDrawnSvgString();
        const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        downloadBlob(blob, `${newItemName || 'custom-part'}_51x48mm.svg`);
        notify('현재 그린 파츠만 51×48mm SVG로 저장했습니다.');
      };

      const exportLiveCanvasOnlyPNG = () => {
        if (isStudioBlank()) {
          notify('캔버스에 그려진 그림이 없습니다.');
          return;
        }
        const pixelSvg = toPixelSvg(generateDrawnSvgString());
        const blob = new Blob([pixelSvg], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const out = document.createElement('canvas');
          out.width = CANVAS_W * 2;
          out.height = CANVAS_H * 2;
          const ctx = out.getContext('2d');
          ctx.drawImage(img, 0, 0, out.width, out.height);
          URL.revokeObjectURL(url);
          out.toBlob((pngBlob) => {
            if (pngBlob) {
              downloadBlob(pngBlob, `${newItemName || 'custom-part'}_51x48mm.png`);
              notify('현재 그린 파츠만 투명 PNG로 저장했습니다.');
            }
          }, 'image/png');
        };
        img.src = url;
      };

      const sanitizeFileName = (name, fallback = 'layer-part') =>
        (name || fallback).replace(/[\\/:*?"<>|]/g, '_').trim() || fallback;

      const buildLayerObjsSvg = (objs, groupId = 'exported-layer-items') => {
        const inner = objs
          .map((obj) => renderVectorObjToSvg(obj, '    ', false, true))
          .join('');
        return wrapSvg51x48(`  <g id="${groupId}">\n${inner}  </g>`);
      };

      const exportLayerObjsAsPNG = (objs, filename, toastMsg) => {
        const pixelSvg = toPixelSvg(buildLayerObjsSvg(objs));
        const blob = new Blob([pixelSvg], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const img = new Image();
        img.onload = () => {
          const out = document.createElement('canvas');
          out.width = CANVAS_W * 2;
          out.height = CANVAS_H * 2;
          const ctx = out.getContext('2d');
          ctx.drawImage(img, 0, 0, out.width, out.height);
          URL.revokeObjectURL(url);
          out.toBlob((pngBlob) => {
            if (pngBlob) {
              downloadBlob(pngBlob, filename);
              notify(toastMsg);
            }
          }, 'image/png');
        };
        img.src = url;
      };

      const exportSingleLayerSVG = (obj) => {
        if (!obj) return;
        const svg = buildLayerObjsSvg([obj], obj.id || 'single-layer');
        const safeName = sanitizeFileName(obj.name, 'layer-part');
        const blob = new Blob([svg], { type: 'image/svg+xml;charset=utf-8' });
        downloadBlob(blob, `${safeName}_51x48mm.svg`);
        notify(`'${obj.name}' 레이어를 51×48mm SVG로 내보냈습니다!`);
      };

      const exportSelectedLayersSVG = () => {
        if (selectedObjs.length === 0) {
          notify('내보낼 레이어나 그룹을 먼저 선택해주세요!');
          return;
        }

                    {[...drawnObjects].reverse().map((obj) => {
                      const isSel = activeSelectionIds.includes(obj.id);
                      const isHidden = obj.visible === false;
                      const isBase = Boolean(obj.isBaseLayer);
                      const isLocked = Boolean(obj.locked);
                      const isGrp = obj.kind === 'group';
                      const isExpanded = expandedGroupIds.includes(obj.id);
                      const isDragOver = dragOverLayerId === obj.id && dragLayerId !== obj.id;
                      const isEditing = editingLayerId === obj.id;

                      return (
                        <div key={obj.id}>
                          <div
                            draggable={!isEditing}
                            onDragStart={(e) => {
                              setDragLayerId(obj.id);
                              e.dataTransfer.effectAllowed = 'move';
                            }}
                            onDragOver={(e) => {
                              e.preventDefault();
                              if (dragOverLayerId !== obj.id) setDragOverLayerId(obj.id);
                            }}
                            onDragLeave={() => {
                              if (dragOverLayerId === obj.id) setDragOverLayerId(null);
                            }}
                            onDrop={(e) => {
                              e.preventDefault();
                              handleLayerDrop(obj.id);
                            }}
                            onDragEnd={() => {
                              setDragLayerId(null);
                              setDragOverLayerId(null);
                            }}
                            onClick={(e) => handleSelectLayerRow(obj, e)}
                            className={`group px-2 py-1.5 flex items-center gap-1.5 transition cursor-pointer select-none ${
                              isDragOver ? 'border-t-2 border-indigo-500 bg-indigo-50/70' : ''
                            } ${
                              isSel
                                ? isBase
                                  ? 'bg-amber-50/90 ring-1 ring-inset ring-amber-300'
                                  : isGrp
                                  ? 'bg-violet-50/90 ring-1 ring-inset ring-violet-300'
                                  : 'bg-blue-50/90 ring-1 ring-inset ring-blue-300'
                                : isBase
                                ? 'bg-amber-50/35 hover:bg-amber-50/70'
                                : 'hover:bg-slate-50'
                            } ${isHidden ? 'opacity-50' : ''}`}
                          >
                            {/* Eye Visibility Toggle */}
                            <button
                              type="button"
                              onClick={(e) => {
                                e.stopPropagation();
                                handleToggleLayerVisible(obj.id);
                              }}
                              title={isHidden ? '레이어 표시' : '레이어 숨기기'}
                              className={`w-6 h-6 rounded-lg flex items-center justify-center shrink-0 transition cursor-pointer ${
                                isHidden
                                  ? 'text-slate-300 hover:bg-slate-200/70 hover:text-slate-600'
                                  : 'text-slate-600 hover:bg-slate-200/70 hover:text-slate-900'
                              }`}
                            >
                              {isHidden ? (
                                <EyeOff className="w-3.5 h-3.5" />
                              ) : (
                                <Eye className="w-3.5 h-3.5" />
                              )}
                            </button>

                            {/* Multi-Select Checkbox (or Base Badge Icon) */}
                            {isBase ? (
                              <span
                                title="기본 캐릭터 고정 레이어 (삭제 불가)"
                                className="w-4 h-4 rounded bg-amber-200/80 border border-amber-400 text-amber-900 flex items-center justify-center shrink-0"
                              >
                                {obj.kind === 'base-face' ? (
                                  <Smile className="w-2.5 h-2.5" />
                                ) : (
                                  <Shirt className="w-2.5 h-2.5" />
                                )}
                              </span>
                            ) : (
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  if (activeBezierNodes.length > 0) finalizeBezierPath(false);
                                  setTool('select');
                                  toggleObjectInSelection(obj.id);
                                }}
                                title="다중 선택 체크"
                                className={`w-4 h-4 rounded border flex items-center justify-center shrink-0 text-[10px] font-black cursor-pointer transition ${
                                  isSel
                                    ? isGrp
                                      ? 'bg-violet-600 border-violet-700 text-white'
                                      : 'bg-blue-600 border-blue-700 text-white'
                                    : 'bg-white border-slate-300 text-transparent hover:border-indigo-400'
                                }`}
                              >
                                ✓
                              </button>
                            )}

                            {/* Group Expand Chevron */}
                            {isGrp && (
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  handleToggleGroupExpand(obj.id);
                                }}
                                title={isExpanded ? '그룹 접기' : '그룹 펼치기'}
                                className="p-0.5 rounded hover:bg-violet-200/60 text-violet-700 shrink-0 cursor-pointer"
                              >
                                {isExpanded ? (
                                  <ChevronDown className="w-3.5 h-3.5" />
                                ) : (
                                  <ChevronRight className="w-3.5 h-3.5" />
                                )}
                              </button>
                            )}

                            {/* Photoshop Checkerboard Layer Thumbnail */}
                            <div
                              className="relative w-10 h-9 rounded-lg border border-slate-300 bg-white overflow-hidden shrink-0 flex items-center justify-center shadow-2xs"
                              style={{
                                backgroundImage:
                                  'conic-gradient(#e2e8f0 90deg, #ffffff 90deg 180deg, #e2e8f0 180deg 270deg, #ffffff 270deg)',
                                backgroundSize: '8px 8px',
                              }}
                            >
                              <div
                                className="w-full h-full pointer-events-none"
                                dangerouslySetInnerHTML={{
                                  __html: renderLayerThumbnailSvg(obj),
                                }}
                              />
                              {isGrp && (
                                <span className="absolute bottom-0.5 right-0.5 w-3.5 h-3.5 rounded bg-violet-600 text-white flex items-center justify-center shadow-xs">
                                  {isExpanded ? (
                                    <FolderOpen className="w-2.5 h-2.5" />
                                  ) : (
                                    <Folder className="w-2.5 h-2.5" />
                                  )}
                                </span>
                              )}
                            </div>

                            {/* Layer Name (Double-Click to Rename for User Layers) & Metadata */}
                            <div className="flex-1 min-w-0">
                              {isEditing ? (
                                <input
                                  type="text"
                                  value={editingLayerName}
                                  autoFocus
                                  onClick={(e) => e.stopPropagation()}
                                  onChange={(e) => setEditingLayerName(e.target.value)}
                                  onBlur={handleCommitRenameLayer}
                                  onKeyDown={(e) => {
                                    if (e.key === 'Enter') handleCommitRenameLayer();
                                    if (e.key === 'Escape') {
                                      setEditingLayerId(null);
                                      setEditingLayerName('');
                                    }
                                  }}
                                  className="w-full px-1.5 py-0.5 rounded bg-white border border-indigo-500 text-xs font-extrabold text-slate-900 focus:outline-none"
                                />
                              ) : (
                                <div
                                  onDoubleClick={(e) => {
                                    e.stopPropagation();
                                    handleStartRenameLayer(obj);
                                  }}
                                  title={
                                    isBase
                                      ? '기본 캐릭터 레이어 (삭제 불가 · 드래그로 순서 조절 가능)'
                                      : '더블클릭하여 레이어 이름 변경'
                                  }
                                  className={`text-xs font-extrabold truncate flex items-center gap-1 ${
                                    isSel ? 'text-slate-900' : 'text-slate-700'
                                  }`}
                                >
                                  <span className="truncate">{obj.name}</span>
                                  {isBase && (
                                    <span className="px-1 py-0.2 rounded bg-amber-100 border border-amber-300 text-amber-900 text-[9px] font-black shrink-0">
                                      기본
                                    </span>
                                  )}
                                </div>
                              )}

                              <div className="flex items-center gap-1.5 mt-0.5 text-[10px] font-bold text-slate-400">
                                {isBase ? (
                                  <span className="text-amber-700/90">
                                    삭제 불가 · 표시/숨김
                                  </span>
                                ) : isGrp ? (
                                  <span className="text-violet-600">
                                    그룹 · 하위 {obj.children?.length || 0}개
                                  </span>
                                ) : (
                                  <>
                                    <span
                                      className="w-2.5 h-2.5 rounded-xs shrink-0 inline-block"
                                      style={{
                                        backgroundColor:
                                          obj.fillColor && obj.fillColor !== 'none'
                                            ? obj.fillColor
                                            : 'transparent',
                                        border:
                                          obj.strokeColor && obj.strokeColor !== 'none'
                                            ? `2px solid ${obj.strokeColor}`
                                            : '1px dashed #94a3b8',
                                      }}
                                    />
                                    <span>
                                      {obj.kind === 'bezier' ? '펜툴' : '자유그리기'}
                                    </span>
                                    {obj.strokeColor && obj.strokeColor !== 'none' && (
                                      <span>· 선 {obj.strokeWidth}px</span>
                                    )}
                                  </>
                                )}
                              </div>
                            </div>

                            {/* Lock Toggle */}
                            {isBase ? (
                              <span
                                title="기본 캐릭터는 캔버스에서 삭제·변형되지 않도록 고정되어 있습니다"
                                className="w-6 h-6 rounded-lg flex items-center justify-center shrink-0 text-amber-600/80 bg-amber-100/60"
                              >
                                <Lock className="w-3 h-3" />
                              </span>
                            ) : (
                              <button
                                type="button"
                                onClick={(e) => {
                                  e.stopPropagation();
                                  handleToggleLayerLock(obj.id);
                                }}
                                title={isLocked ? '레이어 잠금 해제' : '레이어 잠그기'}
                                className={`w-6 h-6 rounded-lg flex items-center justify-center shrink-0 transition cursor-pointer ${
                                  isLocked
                                    ? 'bg-amber-100 text-amber-700'
                                    : 'text-slate-300 opacity-0 group-hover:opacity-100 hover:bg-slate-200/70 hover:text-slate-600'
                                }`}
                              >
                                {isLocked ? (
                                  <Lock className="w-3 h-3" />
                                ) : (
                                  <Unlock className="w-3 h-3" />
                                )}
                              </button>
                            )}
                          </div>

                          {/* Expanded Group Children Sub-Rows */}
                          {isGrp && isExpanded && obj.children && (
                            <div className="bg-violet-50/40 border-t border-violet-100 divide-y divide-violet-100/70">
                              {[...obj.children].reverse().map((child, childIdx) => (
                                <div
                                  key={child.id || childIdx}
                                  className="pl-10 pr-3 py-1 flex items-center gap-2 text-xs text-slate-600"
                                >
                                  <div
                                    className="w-7 h-6 rounded border border-slate-200 bg-white overflow-hidden shrink-0"
                                    style={{
                                      backgroundImage:
                                        'conic-gradient(#e2e8f0 90deg, #ffffff 90deg 180deg, #e2e8f0 180deg 270deg, #ffffff 270deg)',
                                      backgroundSize: '6px 6px',
                                    }}
                                  >
                                    <div
                                      className="w-full h-full pointer-events-none"
                                      dangerouslySetInnerHTML={{
                                        __html: renderLayerThumbnailSvg(child),
                                      }}
                                    />
                                  </div>
                                  <span className="font-bold truncate flex-1 text-[11px]">
                                    {child.name || `하위 오브젝트 ${childIdx + 1}`}
                                  </span>
                                  <span className="text-[10px] font-bold text-slate-400 shrink-0">
                                    {child.kind === 'bezier' ? '펜툴' : '자유그리기'}
                                  </span>
                                </div>
                              ))}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>

                  {/* Layer Position, Copy, Delete & Group Toolbar (Right Above Export Bar) */}
                  <div className="px-2.5 py-1.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-1 shrink-0">
                    {/* Layer Position & Copy/Delete */}
                    <div className="flex items-center gap-1 shrink-0">
                      <button
                        type="button"
                        onClick={() => handleMoveSelectedOrder('up')}
                        disabled={selectedObjs.length === 0}
                        title="레이어 위로 이동"
                        className="p-1.5 rounded-lg bg-white hover:bg-slate-200 disabled:opacity-40 text-slate-700 border border-slate-300 cursor-pointer disabled:cursor-not-allowed"
                      >
                        <ArrowUp className="w-3.5 h-3.5" />
                      </button>
                      <button
                        type="button"
                        onClick={() => handleMoveSelectedOrder('down')}
                        disabled={selectedObjs.length === 0}
                        title="레이어 아래로 이동"
                        className="p-1.5 rounded-lg bg-white hover:bg-slate-200 disabled:opacity-40 text-slate-700 border border-slate-300 cursor-pointer disabled:cursor-not-allowed"
                      >
                        <ArrowDown className="w-3.5 h-3.5" />
                      </button>
                      <button
                        type="button"
                        onClick={handleDuplicateSelected}
                        disabled={userSelectedObjs.length === 0}
                        title="선택 레이어 복사"
                        className="px-2 py-1 rounded-lg bg-white hover:bg-slate-200 disabled:opacity-40 text-slate-700 border border-slate-300 text-[11px] font-extrabold flex items-center gap-1 whitespace-nowrap cursor-pointer disabled:cursor-not-allowed"
                      >
                        <Copy className="w-3 h-3 shrink-0" />
                        <span>복사</span>
                      </button>
                      <button
                        type="button"
                        onClick={handleDeleteSelected}
                        disabled={userSelectedObjs.length === 0}
                        title="선택 레이어 삭제 (Del · 기본 캐릭터 제외)"
                        className="p-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 disabled:bg-white disabled:text-slate-300 text-rose-600 border border-rose-200 disabled:border-slate-200 cursor-pointer disabled:cursor-not-allowed"
                      >
                        <Trash2 className="w-3.5 h-3.5" />
                      </button>
                    </div>

                    {/* Group / Ungroup Buttons */}
                    <div className="flex items-center gap-1 shrink-0">
                      <button
                        type="button"
                        onClick={handleGroupSelected}
                        disabled={userSelectedObjs.length < 2}
                        title="선택한 2개 이상의 그림 레이어를 그룹으로 묶기 (Ctrl+G)"
                        className="px-2 py-1 rounded-lg bg-violet-600 hover:bg-violet-700 disabled:bg-white disabled:text-slate-400 text-white border border-violet-700 disabled:border-slate-200 text-[11px] font-extrabold flex items-center gap-1 whitespace-nowrap transition cursor-pointer disabled:cursor-not-allowed"
                      >
                        <FolderPlus className="w-3 h-3 shrink-0" />
                        <span>그룹</span>
                      </button>

                      <button
                        type="button"
                        onClick={handleUngroupSelected}
                        disabled={!userSelectedObjs.some((o) => o.kind === 'group')}
                        title="선택한 그룹을 개별 레이어로 해제 (Ctrl+Shift+G)"
                        className="px-2 py-1 rounded-lg bg-amber-100 hover:bg-amber-200 disabled:bg-white disabled:text-slate-400 text-amber-950 border border-amber-300 disabled:border-slate-200 text-[11px] font-extrabold flex items-center gap-1 whitespace-nowrap transition cursor-pointer disabled:cursor-not-allowed"
                      >
                        <FolderMinus className="w-3 h-3 shrink-0" />
                        <span>해제</span>
                      </button>
                    </div>
                  </div>

                  {/* Single Selected-Layer SVG Save Button (Pinned at Bottom Right) */}
                  <div className="px-2.5 py-2 bg-indigo-50/80 border-t border-indigo-200 shrink-0">
                    <button
                      type="button"
                      onClick={exportSelectedLayersSVG}
                      disabled={selectedObjs.length === 0}
                      title="선택한 레이어 또는 그룹만 51×48mm SVG로 저장"
                      className="w-full py-2 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 disabled:bg-white disabled:text-slate-400 text-white border border-indigo-700 disabled:border-slate-200 text-xs font-extrabold flex items-center justify-center gap-1.5 whitespace-nowrap shadow-2xs transition active:scale-[0.99] cursor-pointer disabled:cursor-not-allowed"
                    >
                      <FileCode2 className="w-4 h-4 shrink-0" />
                      <span className="truncate">
                        {selectedObjs.length === 0
                          ? '선택한 레이어 SVG 저장 (51×48mm)'
                          : selectedObjs.length === 1
                          ? `'${selectedObjs[0].name}' SVG 저장`
                          : `선택한 ${selectedObjs.length}개 레이어 SVG 저장`}
                      </span>
                    </button>
                  </div>
                </div>
              </aside>
            </main>
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
