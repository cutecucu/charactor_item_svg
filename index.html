</head>
<body class="bg-slate-100 text-slate-800 m-0 p-0">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useRef, useEffect, useCallback } from 'react';
    import { createRoot } from 'react-dom/client';
    import {
      Download,
      Image as ImageIcon,
      Layers,
      Smile,
      Shirt,
      Sparkles,
      Check,
      Upload,
      FileCode2,
      PenTool,
      Eraser,
      Undo2,
      Redo2,
      Trash2,
      Eye,
      EyeOff,
      Grid,
      Plus,
      Sliders,
      RefreshCw,
      Crown,
      User,
      Ruler,
      X,
      MousePointer,
      Copy,
      ArrowUp,
      ArrowDown,
      Brush,
      CornerDownLeft,
      CircleDot,
      FolderPlus,
      FolderMinus,
      FlipHorizontal,
      FlipVertical,
      ArrowLeftRight,
      Folder,
      FolderOpen,
      ChevronDown,
      ChevronRight,
      Lock,
      Unlock,
    } from 'lucide-react';

    // ============================================================================
    // 0. ERROR BOUNDARY
    // ============================================================================
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, errorMessage: '' };
      }

      static getDerivedStateFromError(error) {
        return { hasError: true, errorMessage: error?.message || '알 수 없는 오류' };
      }

      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-slate-100 flex items-center justify-center p-6">
              <div className="max-w-md w-full bg-white rounded-2xl border-2 border-slate-900 p-6 shadow-lg text-center space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-rose-100 text-rose-600 mx-auto flex items-center justify-center font-black text-xl">
                  !
                </div>
                <h2 className="text-lg font-black text-slate-900">
                  화면 표시 중 오류가 발생했습니다
                </h2>
                <p className="text-xs font-mono bg-slate-50 border border-slate-200 rounded-xl p-3 text-slate-600 break-words">
                  {this.state.errorMessage}
                </p>
                <button
                  type="button"
                  onClick={() => window.location.reload()}
                  className="px-4 py-2 rounded-xl bg-slate-900 text-amber-300 font-extrabold text-xs cursor-pointer"
                >
                  새로고침하여 복구
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

    // ============================================================================
    // 1. PHYSICAL & COORDINATE SPECIFICATION: 51 x 48 mm (510 x 480 px, 17:16)
    // ============================================================================
    const MM_WIDTH = 51;
    const MM_HEIGHT = 48;
    const CANVAS_W = 510;
    const CANVAS_H = 480;
    const VIEWBOX = `0 0 ${CANVAS_W} ${CANVAS_H}`;

    // Screen rendering wrapper: proportional scaling without non-scaling-stroke
    const wrapSvgScreen = (innerContent) =>
      `<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="${VIEWBOX}" preserveAspectRatio="xMidYMid meet" style="display:block;width:100%;height:100%;">\n${innerContent}\n</svg>`;

    // Rasterization wrapper: exact 510x480 pixel size for PNG export
    const wrapSvgPixel = (innerContent) =>
      `<svg xmlns="http://www.w3.org/2000/svg" width="${CANVAS_W}" height="${CANVAS_H}" viewBox="${VIEWBOX}" preserveAspectRatio="xMidYMid meet">\n${innerContent}\n</svg>`;

    // Physical 51x48mm file export wrapper for .svg download
    const wrapSvg51x48 = (innerContent) =>
      `<svg xmlns="http://www.w3.org/2000/svg" width="${MM_WIDTH}mm" height="${MM_HEIGHT}mm" viewBox="${VIEWBOX}" preserveAspectRatio="xMidYMid meet">\n${innerContent}\n</svg>`;

    // ============================================================================
    // 2. BASE GUIDE CHARACTER ANCHORED AT BOTTOM-CENTER (13px Stroke)
    //    Split into Face & Clothes layers for independent z-order & visibility
    // ============================================================================
    const BASE_CLOTHES_INNER_SVG = `
      <g id="makemate-base-clothes">
        <!-- Mustard-Olive Green Top (#C5C43A) Anchored at Bottom y=480 -->
        <path d="M 108 480 C 118 405, 142 352, 176 334 L 334 334 C 368 352, 392 405, 402 480 Z" fill="#C5C43A" />
        <path d="M 176 334 C 142 352, 118 405, 108 480" fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 334 334 C 368 352, 392 405, 402 480" fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
        <!-- Inner Sleeve Lines -->
        <path d="M 168 412 C 163 438, 158 462, 155 480" fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 332 390 C 339 422, 346 455, 351 480" fill="none" stroke="#000000" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
      </g>
    `;

    const BASE_FACE_INNER_SVG = `
      <g id="makemate-base-face">
        <!-- Cream Slightly Oval Round Head (cx=255, cy=246, rx=118, ry=112) -->
        <ellipse cx="255" cy="246" rx="118" ry="112" fill="#FCF4DC" stroke="#000000" stroke-width="13" />

        <!-- Soft Peach Blush Marks (#F6DFD0) -->
        <ellipse cx="166" cy="268" rx="20" ry="11" fill="#F6DFD0" />
        <ellipse cx="312" cy="268" rx="21" ry="11" fill="#F6DFD0" />

        <!-- Cute Small Black Dot Eyes -->
        <circle cx="204" cy="244" r="6.5" fill="#141414" />
        <circle cx="274" cy="244" r="6.5" fill="#141414" />

        <!-- Gentle Smile Arc -->
        <path d="M 216 271 Q 240 291 262 270" fill="none" stroke="#000000" stroke-width="8.5" stroke-linecap="round" />
      </g>
    `;

    const GUIDE_CHARACTER_INNER_SVG = `
      <g id="makemate-base-character-bottom-center">
        ${BASE_CLOTHES_INNER_SVG}
        ${BASE_FACE_INNER_SVG}
      </g>
    `;

    const createInitialBaseLayers = () => [
      {
        id: 'base-clothes-layer',
        name: '기본 캐릭터 · 옷',
        kind: 'base-clothes',
        isBaseLayer: true,
        visible: true,
        locked: true,
      },
      {
        id: 'base-face-layer',
        name: '기본 캐릭터 · 얼굴',
        kind: 'base-face',
        isBaseLayer: true,
        visible: true,
        locked: true,
      },
    ];

    const drawBaseLayerOnCtx = (ctx, kind, opacity = 1) => {
      ctx.save();
      ctx.globalAlpha = opacity;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (kind === 'base-clothes') {
        const bodyFill = new Path2D(
          'M 108 480 C 118 405, 142 352, 176 334 L 334 334 C 368 352, 392 405, 402 480 Z'
        );
        ctx.fillStyle = '#C5C43A';
        ctx.fill(bodyFill);

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 13;
        [
          'M 176 334 C 142 352, 118 405, 108 480',
          'M 334 334 C 368 352, 392 405, 402 480',
          'M 168 412 C 163 438, 158 462, 155 480',
          'M 332 390 C 339 422, 346 455, 351 480',
        ].forEach((d) => ctx.stroke(new Path2D(d)));
      } else if (kind === 'base-face') {
        // Cream Slightly Oval Round Head
        ctx.beginPath();
        ctx.ellipse(255, 246, 118, 112, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#FCF4DC';
        ctx.fill();
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 13;
        ctx.stroke();

        // Soft Peach Blush Marks
        ctx.fillStyle = '#F6DFD0';
        ctx.beginPath();
        ctx.ellipse(166, 268, 20, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(312, 268, 21, 11, 0, 0, Math.PI * 2);
        ctx.fill();

        // Cute Small Black Dot Eyes
        ctx.fillStyle = '#141414';
        ctx.beginPath();
        ctx.arc(204, 244, 6.5, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(274, 244, 6.5, 0, Math.PI * 2);
        ctx.fill();

        // Gentle Smile Arc
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 8.5;
        ctx.stroke(new Path2D('M 216 271 Q 240 291 262 270'));
      }

      ctx.restore();
    };

    const BASE_CHARACTER_SVG = wrapSvgScreen(GUIDE_CHARACTER_INNER_SVG);

    const CATEGORIES = [
      { id: 'all', name: '전체', icon: Layers },
      { id: 'custom', name: '내 그림', icon: PenTool },
      { id: 'hat', name: '모자/헤어', icon: Crown },
      { id: 'accessory', name: '안경/소품', icon: Sparkles },
      { id: 'clothes', name: '의상', icon: Shirt },
      { id: 'face', name: '표정/기타', icon: Smile },
      { id: 'base', name: '베이스', icon: User },
    ];

    const LAYER_STACK_ORDER = ['base', 'clothes', 'face', 'hat', 'accessory'];

    const INITIAL_ITEMS = [
      {
        id: 'base-default',
        category: 'base',
        name: '기본 캐릭터',
        svg: wrapSvg51x48(GUIDE_CHARACTER_INNER_SVG),
      },
    ];

    const FILL_PALETTE = [
      { name: '블랙', hex: '#000000' },
      { name: '화이트', hex: '#FFFFFF' },
      { name: '러블리 민트', hex: '#99E6D8' },
      { name: '코랄 레드', hex: '#EF4444' },
      { name: '버터 옐로우', hex: '#FDE047' },
      { name: '머스타드 그린', hex: '#C5C43A' },
      { name: '크림 피부색', hex: '#FCF4DC' },
      { name: '살구 볼터치', hex: '#F6DFD0' },
      { name: '스카이 블루', hex: '#7DD3FC' },
      { name: '피치 핑크', hex: '#F472B6' },
      { name: '오렌지 팝', hex: '#FB923C' },
      { name: '라벤더 퍼플', hex: '#C084FC' },
      { name: '새싹 그린', hex: '#84CC16' },
      { name: '초코 브라운', hex: '#5C3A21' },
    ];

    const DRAW_STYLE_MODES = [
      { id: 'stroke', label: '선' },
      { id: 'fill', label: '면' },
      { id: 'both', label: '선+면' },
    ];

    // ============================================================================
    // 3. COLOR CONVERSION HELPERS (PHOTOSHOP-STYLE HSV PICKER)
    // ============================================================================
    const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

    const normalizeHex = (input) => {
      if (!input || typeof input !== 'string') return null;
      const trimmed = input.trim();
      if (trimmed.toLowerCase() === 'none') return 'none';
      const cleaned = trimmed.startsWith('#') ? trimmed.slice(1) : trimmed;
      if (/^[0-9a-fA-F]{3}$/.test(cleaned)) {
        const expanded = cleaned
          .split('')
          .map((ch) => ch + ch)
          .join('');
        return `#${expanded.toUpperCase()}`;
      }
      if (/^[0-9a-fA-F]{6}$/.test(cleaned)) {
        return `#${cleaned.toUpperCase()}`;
      }
      return null;
    };

    const hexToRgb = (hex) => {
      const norm = normalizeHex(hex);
      if (!norm || norm === 'none') return { r: 0, g: 0, b: 0 };
      const num = parseInt(norm.slice(1), 16);
      return {
        r: (num >> 16) & 255,
        g: (num >> 8) & 255,
        b: num & 255,
      };
    };

    const rgbToHex = (r, g, b) => {
      const toHex = (n) => clamp(Math.round(n), 0, 255).toString(16).padStart(2, '0');
      return `#${toHex(r)}${toHex(g)}${toHex(b)}`.toUpperCase();
    };

    const rgbToHsv = (r, g, b) => {
      const rn = r / 255;
      const gn = g / 255;
      const bn = b / 255;
      const max = Math.max(rn, gn, bn);
      const min = Math.min(rn, gn, bn);
      const d = max - min;
      let h = 0;
      const s = max === 0 ? 0 : d / max;
      const v = max;

      if (d !== 0) {
        if (max === rn) h = ((gn - bn) / d) % 6;
        else if (max === gn) h = (bn - rn) / d + 2;
        else h = (rn - gn) / d + 4;
        h *= 60;
        if (h < 0) h += 360;
      }
      return { h, s: s * 100, v: v * 100 };
    };

    const hsvToRgb = (h, s, v) => {
      const sn = clamp(s, 0, 100) / 100;
      const vn = clamp(v, 0, 100) / 100;
      const hn = ((h % 360) + 360) % 360;
      const c = vn * sn;
      const x = c * (1 - Math.abs(((hn / 60) % 2) - 1));
      const m = vn - c;
      let r = 0, g = 0, b = 0;

      if (hn < 60) [r, g, b] = [c, x, 0];
      else if (hn < 120) [r, g, b] = [x, c, 0];
      else if (hn < 180) [r, g, b] = [0, c, x];
      else if (hn < 240) [r, g, b] = [0, x, c];
      else if (hn < 300) [r, g, b] = [x, 0, c];
      else [r, g, b] = [c, 0, x];

      return {
        r: Math.round((r + m) * 255),
        g: Math.round((g + m) * 255),
        b: Math.round((b + m) * 255),
      };
    };

    const hsvToHex = (h, s, v) => {
      const { r, g, b } = hsvToRgb(h, s, v);
      return rgbToHex(r, g, b);
    };

    const hexToHsv = (hex) => {
      const { r, g, b } = hexToRgb(hex);
      return rgbToHsv(r, g, b);
    };

    // ============================================================================
    // 4. GEOMETRY, BEZIER & VECTOR OBJECT HELPERS
    // ============================================================================
    const sampleCubicBezier = (p0, p1, p2, p3, steps = 14) => {
      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const mt = 1 - t;
        const x =
          mt * mt * mt * p0.x +
          3 * mt * mt * t * p1.x +
          3 * mt * t * t * p2.x +
          t * t * t * p3.x;
        const y =
          mt * mt * mt * p0.y +
          3 * mt * mt * t * p1.y +
          3 * mt * t * t * p2.y +
          t * t * t * p3.y;
        pts.push({ x, y });
      }
      return pts;
    };

    const getObjectSamplePoints = (obj) => {
      if (!obj) return [];
      if (obj.kind === 'group' && obj.children) {
        let allPts = [];
        obj.children.forEach((ch) => {
          allPts = allPts.concat(getObjectSamplePoints(ch));
        });
        return allPts;
      }
      if (obj.kind === 'bezier') {
        const nodes = obj.nodes || [];
        if (nodes.length === 0) return [];
        if (nodes.length === 1) return [{ x: nodes[0].x, y: nodes[0].y }];
        let pts = [];
        for (let i = 1; i < nodes.length; i++) {
          const prev = nodes[i - 1];
          const curr = nodes[i];
          pts = pts.concat(sampleCubicBezier(prev, prev.hOut, curr.hIn, curr, 14));
        }
        if (obj.closed && nodes.length > 2) {
          const last = nodes[nodes.length - 1];
          const first = nodes[0];
          pts = pts.concat(sampleCubicBezier(last, last.hOut, first.hIn, first, 14));
        }
        return pts;
      }
      return obj.points || [];
    };

    const bezierNodesToSvgPath = (nodes, closed = false) => {
      if (!nodes || nodes.length === 0) return '';
      if (nodes.length === 1) {
        const n = nodes[0];
        return `M ${n.x.toFixed(1)} ${n.y.toFixed(1)} L ${(n.x + 0.1).toFixed(1)} ${n.y.toFixed(1)}`;
      }
      let d = `M ${nodes[0].x.toFixed(1)} ${nodes[0].y.toFixed(1)}`;
      for (let i = 1; i < nodes.length; i++) {
        const prev = nodes[i - 1];
        const curr = nodes[i];
        d += ` C ${prev.hOut.x.toFixed(1)} ${prev.hOut.y.toFixed(1)}, ${curr.hIn.x.toFixed(1)} ${curr.hIn.y.toFixed(1)}, ${curr.x.toFixed(1)} ${curr.y.toFixed(1)}`;
      }
      if (closed && nodes.length > 2) {
        const last = nodes[nodes.length - 1];
        const first = nodes[0];
        d += ` C ${last.hOut.x.toFixed(1)} ${last.hOut.y.toFixed(1)}, ${first.hIn.x.toFixed(1)} ${first.hIn.y.toFixed(1)}, ${first.x.toFixed(1)} ${first.y.toFixed(1)} Z`;
      }
      return d;
    };

    const pointsToSvgPath = (pts, closePath = false) => {
      if (!pts || pts.length === 0) return '';
      if (pts.length === 1) {
        const p = pts[0];
        return `M ${p.x.toFixed(1)} ${p.y.toFixed(1)} L ${(p.x + 0.1).toFixed(1)} ${p.y.toFixed(1)}`;
      }
      let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
      for (let i = 1; i < pts.length; i++) {
        const midX = ((pts[i - 1].x + pts[i].x) / 2).toFixed(1);
        const midY = ((pts[i - 1].y + pts[i].y) / 2).toFixed(1);
        d += ` Q ${pts[i - 1].x.toFixed(1)} ${pts[i - 1].y.toFixed(1)} ${midX} ${midY}`;
      }
      const last = pts[pts.length - 1];
      d += ` L ${last.x.toFixed(1)} ${last.y.toFixed(1)}`;
      if (closePath) d += ' Z';
      return d;
    };

    const getObjectBounds = (obj) => {
      const pts = getObjectSamplePoints(obj);
      if (!pts || pts.length === 0) {
        return { minX: 0, minY: 0, maxX: 0, maxY: 0, width: 0, height: 0, cx: 0, cy: 0 };
      }
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      for (const p of pts) {
        if (p.x < minX) minX = p.x;
        if (p.y < minY) minY = p.y;
        if (p.x > maxX) maxX = p.x;
        if (p.y > maxY) maxY = p.y;
      }
      const pad = 4;
      if (maxX - minX < 8) {
        minX -= pad;
        maxX += pad;
      }
      if (maxY - minY < 8) {
        minY -= pad;
        maxY += pad;
      }
      const width = maxX - minX;
      const height = maxY - minY;
      return {
        minX,
        minY,
        maxX,
        maxY,
        width,
        height,
        cx: minX + width / 2,
        cy: minY + height / 2,
      };
    };

    const getCombinedBounds = (objs) => {
      if (!objs || objs.length === 0) {
        return { minX: 0, minY: 0, maxX: 0, maxY: 0, width: 0, height: 0, cx: 0, cy: 0 };
      }
      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;
      for (const o of objs) {
        const b = getObjectBounds(o);
        if (b.minX < minX) minX = b.minX;
        if (b.minY < minY) minY = b.minY;
        if (b.maxX > maxX) maxX = b.maxX;
        if (b.maxY > maxY) maxY = b.maxY;
      }
      const width = maxX - minX;
      const height = maxY - minY;
      return {
        minX,
        minY,
        maxX,
        maxY,
        width,
        height,
        cx: minX + width / 2,
        cy: minY + height / 2,
      };
    };

    const distToSegment = (p, v, w) => {
      const l2 = (w.x - v.x) ** 2 + (w.y - v.y) ** 2;
      if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
      let t = ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2;
      t = Math.max(0, Math.min(1, t));
      return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
    };

    const isPointInPolygon = (pt, pts) => {
      if (!pts || pts.length < 3) return false;
      let inside = false;
      for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
        const xi = pts[i].x;
        const yi = pts[i].y;
        const xj = pts[j].x;
        const yj = pts[j].y;
        const intersect =
          yi > pt.y !== yj > pt.y &&
          pt.x < ((xj - xi) * (pt.y - yi)) / (yj - yi + 0.00001) + xi;
        if (intersect) inside = !inside;
      }
      return inside;
    };

    const hitTestObject = (pt, obj) => {
      if (!obj) return false;
      if (obj.kind === 'group' && obj.children && obj.children.length > 0) {
        return obj.children.some((child) => hitTestObject(pt, child));
      }
      const pts = getObjectSamplePoints(obj);
      if (!pts || pts.length === 0) return false;
      const b = getObjectBounds(obj);
      const threshold = Math.max((obj.strokeWidth || 13) / 2 + 8, 12);

      if (
        pt.x < b.minX - threshold ||
        pt.x > b.maxX + threshold ||
        pt.y < b.minY - threshold ||
        pt.y > b.maxY + threshold
      ) {
        return false;
      }

      if (pts.length === 1) {
        return Math.hypot(pt.x - pts[0].x, pt.y - pts[0].y) <= threshold;
      }
      for (let i = 1; i < pts.length; i++) {
        if (distToSegment(pt, pts[i - 1], pts[i]) <= threshold) return true;
      }
      if (obj.closed && pts.length > 2) {
        if (distToSegment(pt, pts[pts.length - 1], pts[0]) <= threshold) return true;
      }
      if (obj.fillColor && obj.fillColor !== 'none' && isPointInPolygon(pt, pts)) {
        return true;
      }
      return false;
    };

    const translateVectorObj = (obj, dx, dy) => {
      if (obj.kind === 'group' && obj.children) {
        return {
          ...obj,
          children: obj.children.map((ch) => translateVectorObj(ch, dx, dy)),
        };
      }
      if (obj.kind === 'bezier' && obj.nodes) {
        return {
          ...obj,
          nodes: obj.nodes.map((n) => ({
            x: n.x + dx,
            y: n.y + dy,
            hIn: { x: n.hIn.x + dx, y: n.hIn.y + dy },
            hOut: { x: n.hOut.x + dx, y: n.hOut.y + dy },
          })),
        };
      }
      return {
        ...obj,
        points: (obj.points || []).map((p) => ({ x: p.x + dx, y: p.y + dy })),
      };
    };

    const mapVectorObjPoints = (obj, mapPt) => {
      if (obj.kind === 'group' && obj.children) {
        return {
          ...obj,
          children: obj.children.map((ch) => mapVectorObjPoints(ch, mapPt)),
        };
      }
      if (obj.kind === 'bezier' && obj.nodes) {
        return {
          ...obj,
          nodes: obj.nodes.map((n) => {
            const np = mapPt(n);
            return {
              x: np.x,
              y: np.y,
              hIn: mapPt(n.hIn),
              hOut: mapPt(n.hOut),
            };
          }),
        };
      }
      return {
        ...obj,
        points: (obj.points || []).map(mapPt),
      };
    };

    const updateVectorObjStyle = (obj, updater) => {
      if (obj.kind === 'group' && obj.children) {
        return {
          ...obj,
          children: obj.children.map((ch) => updateVectorObjStyle(ch, updater)),
        };
      }
      return updater(obj);
    };

    const getObjectStyleMode = (obj) => {
      if (!obj) return 'both';
      const leaf = obj.kind === 'group' && obj.children?.length ? obj.children[0] : obj;
      const hasStroke = Boolean(leaf?.strokeColor && leaf.strokeColor !== 'none');
      const hasFill = Boolean(leaf?.fillColor && leaf.fillColor !== 'none');
      if (hasStroke && hasFill) return 'both';
      if (hasFill && !hasStroke) return 'fill';
      return 'stroke';
    };

    const getResizeHandles = (b) => [
      { id: 'nw', x: b.minX, y: b.minY },
      { id: 'n', x: b.cx, y: b.minY },
      { id: 'ne', x: b.maxX, y: b.minY },
      { id: 'e', x: b.maxX, y: b.cy },
      { id: 'se', x: b.maxX, y: b.maxY },
      { id: 's', x: b.cx, y: b.maxY },
      { id: 'sw', x: b.minX, y: b.maxY },
      { id: 'w', x: b.minX, y: b.cy },
    ];

    const getRotationHandle = (b) => ({
      x: b.cx,
      y: Math.max(14, b.minY - 26),
    });

    // ============================================================================
    // 5. MAIN APPLICATION
    // ============================================================================
    function App() {
      const [items, setItems] = useState(INITIAL_ITEMS);
      const [equipped, setEquipped] = useState({
        base: 'base-default',
        clothes: null,
        face: null,
        hat: null,
        accessory: null,
      });

      // Layer visibility & Preview Export State
      const [layerVisible, setLayerVisible] = useState({
        base: true,
        clothes: true,
        face: true,
        hat: true,
        accessory: true,
      });
      const [previewBgColor, setPreviewBgColor] = useState('transparent');
      const [includeBaseOnExport, setIncludeBaseOnExport] = useState(true);

      // Tool, Stroke, and Photoshop-Style Color Picker State
      const [tool, setTool] = useState('bezier'); // 'select' | 'bezier' | 'freehand' | 'eraser'
      const [drawStyleMode, setDrawStyleMode] = useState('both'); // 'stroke' | 'fill' | 'both'
      const [blackStrokeWidth, setBlackStrokeWidth] = useState(13);
      const [strokeColor, setStrokeColor] = useState('#000000');
      const [lastSolidStrokeColor, setLastSolidStrokeColor] = useState('#000000');
      const [fillColor, setFillColor] = useState('#99E6D8');
      const [lastSolidFillColor, setLastSolidFillColor] = useState('#99E6D8');
      const [activeColorTarget, setActiveColorTarget] = useState('fill'); // 'fill' | 'stroke'
      const initialHsv = hexToHsv('#99E6D8');
      const [pickerHue, setPickerHue] = useState(initialHsv.h);
      const [pickerSat, setPickerSat] = useState(initialHsv.s);
      const [pickerVal, setPickerVal] = useState(initialHsv.v);
      const [hexInputText, setHexInputText] = useState('#99E6D8');

      // Vector Objects & Layer Panel State (includes non-deletable Base Clothes & Face layers)
      const initialLayersRef = useRef(null);
      if (!initialLayersRef.current) {
        initialLayersRef.current = createInitialBaseLayers();
      }
      const [drawnObjects, setDrawnObjects] = useState(initialLayersRef.current);
      const [drawInsertPos, setDrawInsertPos] = useState('top'); // 'top' | 'behind-clothes'
      const [selectedObjId, setSelectedObjId] = useState(null);
      const [selectedObjIds, setSelectedObjIds] = useState([]);
      const [marqueeBox, setMarqueeBox] = useState(null);
      const [activeBezierNodes, setActiveBezierNodes] = useState([]);
      const [hoverCanvasPt, setHoverCanvasPt] = useState(null);
      const [canvasCursor, setCanvasCursor] = useState('default');
      const [expandedGroupIds, setExpandedGroupIds] = useState([]);
      const [editingLayerId, setEditingLayerId] = useState(null);
      const [editingLayerName, setEditingLayerName] = useState('');
      const [dragLayerId, setDragLayerId] = useState(null);
      const [dragOverLayerId, setDragOverLayerId] = useState(null);

      // Undo/Redo History
      const [history, setHistory] = useState(() => [
        JSON.parse(JSON.stringify(initialLayersRef.current)),
      ]);
      const [historyIdx, setHistoryIdx] = useState(0);

      // Guide & Export UI State
      const [showGuide, setShowGuide] = useState(true);
      const [guideOpacity, setGuideOpacity] = useState(1);
      const [showEquippedOnCanvas, setShowEquippedOnCanvas] = useState(true);
      const [showRulerGrid, setShowRulerGrid] = useState(true);
      const [customGuideDataUrl, setCustomGuideDataUrl] = useState(null);
      const [saveCategory, setSaveCategory] = useState('hat');
      const [newItemName, setNewItemName] = useState('내 커스텀 파츠');
      const [toast, setToast] = useState(null);

      // Refs
      const drawCanvasRef = useRef(null);
      const drawnObjectsRef = useRef(initialLayersRef.current);
      const svPadRef = useRef(null);
      const hueBarRef = useRef(null);
      const fileUploadRef = useRef(null);
      const guideUploadRef = useRef(null);
      const interactionRef = useRef({ mode: 'none' });
      const pickerDragRef = useRef(null);

      const updateDrawnObjects = useCallback((nextObjs) => {
        drawnObjectsRef.current = nextObjs;
        setDrawnObjects(nextObjs);
      }, []);

      const insertNewUserObject = useCallback(
        (currentList, newObj) => {
          if (drawInsertPos === 'behind-clothes') {
            const clothesIdx = currentList.findIndex((o) => o.kind === 'base-clothes');
            if (clothesIdx !== -1) {
              return [
                ...currentList.slice(0, clothesIdx),
                newObj,
                ...currentList.slice(clothesIdx),
              ];
            }
            return [newObj, ...currentList];
          }
          return [...currentList, newObj];
        },
        [drawInsertPos]
      );

      const activeSelectionIds =
        selectedObjIds.length > 0
          ? selectedObjIds
          : selectedObjId
          ? [selectedObjId]
          : [];

      const userDrawnObjects = drawnObjects.filter((o) => !o.isBaseLayer);
      const anyBaseLayerVisible = drawnObjects.some(
        (o) => o.isBaseLayer && o.visible !== false
      );
      const selectedObjs = drawnObjects.filter((o) => activeSelectionIds.includes(o.id));
      const userSelectedObjs = selectedObjs.filter((o) => !o.isBaseLayer);
      const editableSelectedObjs = selectedObjs.filter(
        (o) => !o.isBaseLayer && o.visible !== false && !o.locked
      );
      const selectedObj =
        selectedObjs.length === 1
          ? selectedObjs[0]
          : drawnObjects.find((o) => o.id === selectedObjId) || null;
      const editableSelectedObj =
        editableSelectedObjs.length === 1 ? editableSelectedObjs[0] : null;

      const selectSingleObject = useCallback((id) => {
        setSelectedObjId(id);
        setSelectedObjIds(id ? [id] : []);
      }, []);

      const toggleObjectInSelection = useCallback(
        (id) => {
          setSelectedObjIds((prev) => {
            const base = prev.length > 0 ? prev : selectedObjId ? [selectedObjId] : [];
            const exists = base.includes(id);
            const next = exists ? base.filter((item) => item !== id) : [...base, id];
            setSelectedObjId(next[next.length - 1] || null);
            return next;
          });
        },
        [selectedObjId]
      );

      const notify = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => {
          setToast((prev) => (prev === msg ? null : prev));
        }, 2800);
      }, []);

      const commitHistory = useCallback(
        (nextObjs) => {
          const snap = JSON.parse(JSON.stringify(nextObjs));
          setHistory((prev) => {
            const sliced = prev.slice(0, historyIdx + 1);
            return [...sliced, snap];
          });
          setHistoryIdx((prev) => prev + 1);
        },
        [historyIdx]
      );

      const resolveSolidStroke = useCallback(
        (c) => (c && c !== 'none' ? c : lastSolidStrokeColor || '#000000'),
        [lastSolidStrokeColor]
      );

      const resolveSolidFill = useCallback(
        (c) => (c && c !== 'none' ? c : lastSolidFillColor || '#99E6D8'),
        [lastSolidFillColor]
      );

      const syncPickerFromHex = useCallback((hex) => {
        if (!hex || hex === 'none') {
          setHexInputText('NONE');
          return;
        }
        const norm = normalizeHex(hex);
        if (!norm || norm === 'none') return;
        const hsv = hexToHsv(norm);
        setPickerHue(hsv.h);
        setPickerSat(hsv.s);
        setPickerVal(hsv.v);
        setHexInputText(norm);
      }, []);

      const handleSelectColorTarget = useCallback(
        (target) => {
          setActiveColorTarget(target);
          syncPickerFromHex(target === 'fill' ? fillColor : strokeColor);
        },
        [fillColor, strokeColor, syncPickerFromHex]
      );

      // Apply color change to active target (fill or stroke) & selected editable objects
      const applyActiveTargetColor = useCallback(
        (hex, shouldCommit = true, shouldSyncPicker = true) => {
          const isFill = activeColorTarget === 'fill';
          const isNone = hex === 'none';

          if (isFill) {
            setFillColor(hex);
            if (!isNone) {
              setLastSolidFillColor(hex);
              if (drawStyleMode === 'stroke') setDrawStyleMode('both');
            } else if (drawStyleMode === 'both') {
              setDrawStyleMode('stroke');
            }
          } else {
            setStrokeColor(hex);
            if (!isNone) {
              setLastSolidStrokeColor(hex);
              if (drawStyleMode === 'fill') setDrawStyleMode('both');
            } else if (drawStyleMode === 'both') {
              setDrawStyleMode('fill');
            }
          }

          if (shouldSyncPicker) {
            syncPickerFromHex(hex);
          }

          if (editableSelectedObjs.length > 0) {
            const idSet = new Set(editableSelectedObjs.map((o) => o.id));
            const next = drawnObjectsRef.current.map((o) => {
              if (!idSet.has(o.id)) return o;
              const updated = updateVectorObjStyle(o, (leaf) =>
                isFill ? { ...leaf, fillColor: hex } : { ...leaf, strokeColor: hex }
              );
              return isFill
                ? { ...updated, fillColor: hex }
                : { ...updated, strokeColor: hex };
            });
            updateDrawnObjects(next);
            if (shouldCommit) commitHistory(next);
          }
        },
        [
          activeColorTarget,
          drawStyleMode,
          editableSelectedObjs,
          syncPickerFromHex,
          updateDrawnObjects,
          commitHistory,
        ]
      );

      const handleSwapColors = useCallback(() => {
        const nextFill = strokeColor;
        const nextStroke = fillColor;
        setFillColor(nextFill);
        setStrokeColor(nextStroke);
        if (nextFill !== 'none') setLastSolidFillColor(nextFill);
        if (nextStroke !== 'none') setLastSolidStrokeColor(nextStroke);
        syncPickerFromHex(activeColorTarget === 'fill' ? nextFill : nextStroke);

        if (editableSelectedObjs.length > 0) {
          const idSet = new Set(editableSelectedObjs.map((o) => o.id));
          const next = drawnObjectsRef.current.map((o) => {
            if (!idSet.has(o.id)) return o;
            const updated = updateVectorObjStyle(o, (leaf) => ({
              ...leaf,
              fillColor: nextFill,
              strokeColor: nextStroke,
            }));
            return { ...updated, fillColor: nextFill, strokeColor: nextStroke };
          });
          updateDrawnObjects(next);
          commitHistory(next);
        }
      }, [
        strokeColor,
        fillColor,
        activeColorTarget,
        editableSelectedObjs,
        syncPickerFromHex,
        updateDrawnObjects,
        commitHistory,
      ]);

      const handleResetDefaultColors = useCallback(() => {
        const defFill = '#99E6D8';
        const defStroke = '#000000';
        setFillColor(defFill);
        setLastSolidFillColor(defFill);
        setStrokeColor(defStroke);
        setLastSolidStrokeColor(defStroke);
        setDrawStyleMode('both');
        syncPickerFromHex(activeColorTarget === 'fill' ? defFill : defStroke);
      }, [activeColorTarget, syncPickerFromHex]);

      const handleDrawStyleModeChange = useCallback(
        (mode, switchTool = null) => {
          setDrawStyleMode(mode);
          const nextStroke = mode === 'fill' ? 'none' : resolveSolidStroke(strokeColor);
          const nextFill = mode === 'stroke' ? 'none' : resolveSolidFill(fillColor);
          setStrokeColor(nextStroke);
          setFillColor(nextFill);
          syncPickerFromHex(activeColorTarget === 'fill' ? nextFill : nextStroke);

          if (switchTool && tool !== 'select') {
            setTool(switchTool);
          }

          if (editableSelectedObjs.length > 0) {
            const idSet = new Set(editableSelectedObjs.map((o) => o.id));
            const next = drawnObjectsRef.current.map((o) => {
              if (!idSet.has(o.id)) return o;
              const updated = updateVectorObjStyle(o, (leaf) => ({
                ...leaf,
                strokeColor: nextStroke,
                fillColor: nextFill,
              }));
              return { ...updated, strokeColor: nextStroke, fillColor: nextFill };
            });
            updateDrawnObjects(next);
            commitHistory(next);
          }
        },
        [
          tool,
          strokeColor,
          fillColor,
          activeColorTarget,
          editableSelectedObjs,
          resolveSolidStroke,
          resolveSolidFill,
          syncPickerFromHex,
          updateDrawnObjects,
          commitHistory,
        ]
      );

      // Photoshop 2D SV Pad & Hue Bar Pointer Handlers
      const updateFromSvPad = useCallback(
        (clientX, clientY, commit = false) => {
          const pad = svPadRef.current;
          if (!pad) return;
          const rect = pad.getBoundingClientRect();
          const s = clamp(((clientX - rect.left) / rect.width) * 100, 0, 100);
          const v = clamp(100 - ((clientY - rect.top) / rect.height) * 100, 0, 100);
          setPickerSat(s);
          setPickerVal(v);
          const hex = hsvToHex(pickerHue, s, v);
          setHexInputText(hex);
          applyActiveTargetColor(hex, commit, false);
        },
        [pickerHue, applyActiveTargetColor]
      );

      const updateFromHueBar = useCallback(
        (clientX, commit = false) => {
          const bar = hueBarRef.current;
          if (!bar) return;
          const rect = bar.getBoundingClientRect();
          const h = clamp(((clientX - rect.left) / rect.width) * 360, 0, 359.9);
          setPickerHue(h);
          const hex = hsvToHex(h, pickerSat, pickerVal);
          setHexInputText(hex);
          applyActiveTargetColor(hex, commit, false);
        },
        [pickerSat, pickerVal, applyActiveTargetColor]
      );

      // ========================================================================
      // UNDO / REDO / CLEAR / BEZIER / GROUP / TRANSFORM / LAYER HANDLERS
      // ========================================================================
      const handleUndo = useCallback(() => {
        if (activeBezierNodes.length > 0) {
          setActiveBezierNodes((prev) => prev.slice(0, -1));
          return;
        }
        if (historyIdx > 0) {
          const nextIdx = historyIdx - 1;
          const snap = JSON.parse(JSON.stringify(history[nextIdx]));
          setHistoryIdx(nextIdx);
          updateDrawnObjects(snap);
          selectSingleObject(null);
        }
      }, [
        activeBezierNodes.length,
        history,
        historyIdx,
        updateDrawnObjects,
        selectSingleObject,
      ]);

      const handleRedo = useCallback(() => {
        if (historyIdx < history.length - 1) {
          const nextIdx = historyIdx + 1;
          const snap = JSON.parse(JSON.stringify(history[nextIdx]));
          setHistoryIdx(nextIdx);
          updateDrawnObjects(snap);
        }
      }, [history, historyIdx, updateDrawnObjects]);

      const handleClearCanvas = useCallback(() => {
        const baseOnly = drawnObjectsRef.current.filter((o) => o.isBaseLayer);
        setActiveBezierNodes([]);
        selectSingleObject(null);
        updateDrawnObjects(baseOnly);
        commitHistory(baseOnly);
      }, [updateDrawnObjects, selectSingleObject, commitHistory]);

      const finalizeBezierPath = useCallback(
        (forceClose = null, fromDoubleClick = false) => {
          if (activeBezierNodes.length === 0) return;

          // 더블클릭으로 종료 시 두 번째 클릭에서 찍힌 중복 마지막 앵커 제거
          let nodesToSave = [...activeBezierNodes];
          if (fromDoubleClick && nodesToSave.length >= 3) {
            const last = nodesToSave[nodesToSave.length - 1];
            const prev = nodesToSave[nodesToSave.length - 2];
            if (Math.hypot(last.x - prev.x, last.y - prev.y) < 8) {
              nodesToSave = nodesToSave.slice(0, -1);
            }
          }

          if (nodesToSave.length < 2) {
            setActiveBezierNodes([]);
            return;
          }
          const isClosed = forceClose === true;
          const resolvedStroke =
            drawStyleMode === 'fill' ? 'none' : resolveSolidStroke(strokeColor);
          const resolvedFill =
            drawStyleMode === 'stroke' ? 'none' : resolveSolidFill(fillColor);
          const userCount = drawnObjectsRef.current.filter((o) => !o.isBaseLayer).length;
          const newObj = {
            id: `obj-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            name: `펜툴 레이어 #${userCount + 1}`,
            kind: 'bezier',
            nodes: JSON.parse(JSON.stringify(nodesToSave)),
            strokeColor: resolvedStroke,
            strokeWidth: blackStrokeWidth,
            fillColor: resolvedFill,
            closed: isClosed,
            visible: true,
            locked: false,
          };
          const next = insertNewUserObject(drawnObjectsRef.current, newObj);
          updateDrawnObjects(next);
          selectSingleObject(newObj.id);
          setActiveBezierNodes([]);
          commitHistory(next);
        },
        [
          activeBezierNodes,
          drawStyleMode,
          strokeColor,
          fillColor,
          blackStrokeWidth,
          resolveSolidStroke,
          resolveSolidFill,
          insertNewUserObject,
          updateDrawnObjects,
          selectSingleObject,
          commitHistory,
        ]
      );

      const handleGroupSelected = useCallback(() => {
        if (userSelectedObjs.length < 2) {
          notify('그룹으로 묶을 그림 레이어를 2개 이상 선택해주세요! (기본 캐릭터 제외)');
          return;
        }
        const idSet = new Set(userSelectedObjs.map((o) => o.id));
        const current = drawnObjectsRef.current;
        const firstIdx = current.findIndex((o) => idSet.has(o.id));
        const children = current
          .filter((o) => idSet.has(o.id))
          .map((o) => JSON.parse(JSON.stringify(o)));

        const groupObj = {
          id: `group-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`,
          name: `그룹 (${children.length}개)`,
          kind: 'group',
          children,
          strokeWidth: children[0]?.strokeWidth || blackStrokeWidth,
          strokeColor: children[0]?.strokeColor || strokeColor,
          fillColor: children[0]?.fillColor || fillColor,
          closed: Boolean(children[0]?.closed),
          visible: true,
          locked: false,
        };

        const remaining = current.filter((o) => !idSet.has(o.id));
        const insertAt = Math.min(Math.max(0, firstIdx), remaining.length);
        const next = [
          ...remaining.slice(0, insertAt),
          groupObj,
          ...remaining.slice(insertAt),
        ];

        updateDrawnObjects(next);
        selectSingleObject(groupObj.id);
        setExpandedGroupIds((prev) =>
          prev.includes(groupObj.id) ? prev : [...prev, groupObj.id]
        );
        setTool('select');
        commitHistory(next);
        notify(`${children.length}개의 레이어가 하나의 그룹으로 묶였습니다! (Ctrl+G)`);
      }, [
        userSelectedObjs,
        blackStrokeWidth,
        strokeColor,
        fillColor,
        updateDrawnObjects,
        selectSingleObject,
        commitHistory,
        notify,
      ]);

      const handleUngroupSelected = useCallback(() => {
        const hasGroup = userSelectedObjs.some((o) => o.kind === 'group');
        if (!hasGroup) {
          notify('그룹 해제할 그룹 레이어를 선택해주세요!');
          return;
        }
        const idSet = new Set(userSelectedObjs.map((o) => o.id));
        const next = [];
        const ungroupedIds = [];

        drawnObjectsRef.current.forEach((o) => {
          if (idSet.has(o.id) && o.kind === 'group' && o.children) {
            o.children.forEach((ch) => {
              const cloned = JSON.parse(JSON.stringify(ch));
              cloned.id = `obj-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
              cloned.visible = o.visible !== false && ch.visible !== false;
              cloned.locked = false;
              next.push(cloned);
              ungroupedIds.push(cloned.id);
            });
          } else {
            next.push(o);
          }
        });

        updateDrawnObjects(next);
        setSelectedObjIds(ungroupedIds);
        setSelectedObjId(ungroupedIds[ungroupedIds.length - 1] || null);
        commitHistory(next);
        notify('그룹이 개별 레이어로 해제되었습니다! (Ctrl+Shift+G)');
      }, [userSelectedObjs, updateDrawnObjects, commitHistory, notify]);

      const handleSelectAllObjects = useCallback(() => {
        if (userDrawnObjects.length === 0) return;
        const allIds = userDrawnObjects.map((o) => o.id);
        setTool('select');
        setSelectedObjIds(allIds);
        setSelectedObjId(allIds[allIds.length - 1]);
      }, [userDrawnObjects]);

      const handleStrokeWidthChange = (px) => {
        setBlackStrokeWidth(px);
        if (editableSelectedObjs.length > 0) {
          const idSet = new Set(editableSelectedObjs.map((o) => o.id));
          const next = drawnObjectsRef.current.map((o) =>
            idSet.has(o.id)
              ? {
                  ...updateVectorObjStyle(o, (leaf) => ({ ...leaf, strokeWidth: px })),
                  strokeWidth: px,
                }
              : o
          );
          updateDrawnObjects(next);
          commitHistory(next);
        }
      };

      const handleFlipSelected = (axis) => {
        if (editableSelectedObjs.length === 0) return;
        const b = getCombinedBounds(editableSelectedObjs);
        const idSet = new Set(editableSelectedObjs.map((o) => o.id));
        const mapPt =
          axis === 'horizontal'
            ? (p) => ({ x: 2 * b.cx - p.x, y: p.y })
            : (p) => ({ x: p.x, y: 2 * b.cy - p.y });

        const next = drawnObjectsRef.current.map((o) =>
          idSet.has(o.id) ? mapVectorObjPoints(o, mapPt) : o
        );
        updateDrawnObjects(next);
        commitHistory(next);
      };

      const handleDuplicateSelected = () => {
        if (userSelectedObjs.length === 0) return;
        const copies = userSelectedObjs.map((orig) => {
          const cloned = translateVectorObj(JSON.parse(JSON.stringify(orig)), 14, 14);
          cloned.id = `${orig.kind === 'group' ? 'group' : 'obj'}-${Date.now()}-${Math.random()
            .toString(36)
            .slice(2, 6)}`;
          cloned.name = `${orig.name} 복제`;
          return cloned;
        });
        const next = [...drawnObjectsRef.current, ...copies];
        updateDrawnObjects(next);
        const newIds = copies.map((c) => c.id);
        setSelectedObjIds(newIds);
        setSelectedObjId(newIds[newIds.length - 1]);
        commitHistory(next);
      };

      const handleMoveSelectedOrder = (dir) => {
        if (activeSelectionIds.length === 0) return;
        const idSet = new Set(activeSelectionIds);
        const list = [...drawnObjectsRef.current];
        let moved = false;

        if (dir === 'up') {
          for (let i = list.length - 2; i >= 0; i--) {
            if (idSet.has(list[i].id) && !idSet.has(list[i + 1].id)) {
              const tmp = list[i];
              list[i] = list[i + 1];
              list[i + 1] = tmp;
              moved = true;
            }
          }
        } else {
          for (let i = 1; i < list.length; i++) {
            if (idSet.has(list[i].id) && !idSet.has(list[i - 1].id)) {
              const tmp = list[i];
              list[i] = list[i - 1];
              list[i - 1] = tmp;
              moved = true;
            }
          }
        }

        if (moved) {
          updateDrawnObjects(list);
          commitHistory(list);
        }
      };

      const handleDeleteSelected = useCallback(() => {
        if (userSelectedObjs.length === 0) return;
        const idSet = new Set(userSelectedObjs.map((o) => o.id));
        const next = drawnObjectsRef.current.filter((o) => !idSet.has(o.id));
        updateDrawnObjects(next);
        selectSingleObject(null);
        commitHistory(next);
      }, [userSelectedObjs, updateDrawnObjects, selectSingleObject, commitHistory]);

      const handleToggleAllBaseLayersVisible = () => {
        const nextVis = !anyBaseLayerVisible;
        setShowGuide(nextVis);
        const next = drawnObjectsRef.current.map((o) =>
          o.isBaseLayer ? { ...o, visible: nextVis } : o
        );
        updateDrawnObjects(next);
        commitHistory(next);
      };

      const handleToggleLayerVisible = (id) => {
        const next = drawnObjectsRef.current.map((o) =>
          o.id === id ? { ...o, visible: o.visible === false ? true : false } : o
        );
        updateDrawnObjects(next);
        commitHistory(next);
      };

      const handleToggleLayerLock = (id) => {
        const next = drawnObjectsRef.current.map((o) =>
          o.id === id && !o.isBaseLayer ? { ...o, locked: !o.locked } : o
        );
        updateDrawnObjects(next);
        commitHistory(next);
      };

      const handleToggleGroupExpand = (id) => {
        setExpandedGroupIds((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const handleStartRenameLayer = (obj) => {
        if (!obj || obj.isBaseLayer) return;
        setEditingLayerId(obj.id);
        setEditingLayerName(obj.name || '');
      };

      const handleCommitRenameLayer = () => {
        if (!editingLayerId) return;
        const trimmed = editingLayerName.trim();
        if (trimmed) {
          const next = drawnObjectsRef.current.map((o) =>
            o.id === editingLayerId ? { ...o, name: trimmed } : o
          );
          updateDrawnObjects(next);
          commitHistory(next);
        }
        setEditingLayerId(null);
        setEditingLayerName('');
      };

      const handleSelectLayerRow = (obj, e) => {
        if (activeBezierNodes.length > 0) finalizeBezierPath();
        if (!obj.isBaseLayer) {
          setTool('select');
        }

        if ((e.shiftKey || e.ctrlKey || e.metaKey) && !obj.isBaseLayer) {
          toggleObjectInSelection(obj.id);
        } else {
          selectSingleObject(obj.id);
        }

        if (!obj.isBaseLayer) {
          const leaf = obj.kind === 'group' && obj.children?.length ? obj.children[0] : obj;
          if (leaf) {
            if (leaf.strokeWidth) setBlackStrokeWidth(leaf.strokeWidth);
            if (leaf.strokeColor) {
              setStrokeColor(leaf.strokeColor);
              if (leaf.strokeColor !== 'none') setLastSolidStrokeColor(leaf.strokeColor);
            }
            if (leaf.fillColor) {
              setFillColor(leaf.fillColor);
              if (leaf.fillColor !== 'none') setLastSolidFillColor(leaf.fillColor);
            }
            setDrawStyleMode(getObjectStyleMode(leaf));
            syncPickerFromHex(
              activeColorTarget === 'fill'
                ? leaf.fillColor || 'none'
                : leaf.strokeColor || 'none'
            );
          }
        }
      };

      const handleLayerDrop = (targetId) => {
        if (!dragLayerId || dragLayerId === targetId) {
          setDragLayerId(null);
          setDragOverLayerId(null);
          return;
        }
        const list = [...drawnObjectsRef.current];
        const fromIdx = list.findIndex((o) => o.id === dragLayerId);
        const toIdx = list.findIndex((o) => o.id === targetId);
        if (fromIdx === -1 || toIdx === -1) {
          setDragLayerId(null);
          setDragOverLayerId(null);
          return;
        }
        const [moved] = list.splice(fromIdx, 1);
        list.splice(toIdx, 0, moved);
        updateDrawnObjects(list);
        commitHistory(list);
        setDragLayerId(null);
        setDragOverLayerId(null);
      };

      // Keyboard Shortcuts
      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.target && ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
          const lower = e.key.toLowerCase();

          if ((e.ctrlKey || e.metaKey) && lower === 'z') {
            e.preventDefault();
            if (e.shiftKey) handleRedo();
            else handleUndo();
            return;
          }
          if ((e.ctrlKey || e.metaKey) && lower === 'y') {
            e.preventDefault();
            handleRedo();
            return;
          }
          if ((e.ctrlKey || e.metaKey) && lower === 'g') {
            e.preventDefault();
            if (e.shiftKey) handleUngroupSelected();
            else handleGroupSelected();
            return;
          }

          if (!e.ctrlKey && !e.metaKey && !e.altKey) {
            if (lower === 'v') {
              if (activeBezierNodes.length > 0) finalizeBezierPath();
              setTool('select');
              return;
            }
            if (lower === 'p') {
              selectSingleObject(null);
              setTool('bezier');
              return;
            }
            if (lower === 'b') {
              if (activeBezierNodes.length > 0) finalizeBezierPath();
              selectSingleObject(null);
              setTool('freehand');
              return;
            }
            if (lower === 'e') {
              if (activeBezierNodes.length > 0) finalizeBezierPath();
              selectSingleObject(null);
              setTool('eraser');
              return;
            }
            if (lower === 'x') {
              if (e.shiftKey) {
                handleSwapColors();
              } else {
                handleSelectColorTarget(activeColorTarget === 'fill' ? 'stroke' : 'fill');
              }
              return;
            }
          }

          if (e.key === 'Enter' && activeBezierNodes.length > 0) {
            e.preventDefault();
            finalizeBezierPath();
          } else if (e.key === 'Escape') {
            if (activeBezierNodes.length > 0) {
              e.preventDefault();
              setActiveBezierNodes([]);
            } else if (activeSelectionIds.length > 0) {
              e.preventDefault();
              selectSingleObject(null);
            }
          } else if (
            (e.key === 'Delete' || e.key === 'Backspace') &&
            userSelectedObjs.length > 0
          ) {
            e.preventDefault();
            handleDeleteSelected();
          } else if (
            editableSelectedObjs.length > 0 &&
            ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)
          ) {
            e.preventDefault();
            const step = e.shiftKey ? 10 : 1;
            const dx = e.key === 'ArrowLeft' ? -step : e.key === 'ArrowRight' ? step : 0;
            const dy = e.key === 'ArrowUp' ? -step : e.key === 'ArrowDown' ? step : 0;
            const idSet = new Set(editableSelectedObjs.map((o) => o.id));
            const next = drawnObjectsRef.current.map((o) =>
              idSet.has(o.id) ? translateVectorObj(o, dx, dy) : o
            );
            updateDrawnObjects(next);
          }
        };

        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, [
        activeBezierNodes.length,
        activeSelectionIds.length,
        userSelectedObjs.length,
        editableSelectedObjs,
        activeColorTarget,
        handleUndo,
        handleRedo,
        handleGroupSelected,
        handleUngroupSelected,
        finalizeBezierPath,
        handleDeleteSelected,
        handleSwapColors,
        handleSelectColorTarget,
        selectSingleObject,
        updateDrawnObjects,
      ]);

      // Canvas Pointer Coordinate & Interaction Handlers
      const getCanvasPoint = (e) => {
        const canvas = drawCanvasRef.current;
        if (!canvas) return { x: 0, y: 0 };
        const rect = canvas.getBoundingClientRect();
        const clientX =
          e.touches?.[0]?.clientX ?? e.changedTouches?.[0]?.clientX ?? e.clientX;
        const clientY =
          e.touches?.[0]?.clientY ?? e.changedTouches?.[0]?.clientY ?? e.clientY;
        return {
          x: ((clientX - rect.left) / rect.width) * CANVAS_W,
          y: ((clientY - rect.top) / rect.height) * CANVAS_H,
        };
      };

      const handlePointerDown = (e) => {
        if (e.cancelable) e.preventDefault();
        try {
          if (e.pointerId != null) {
            e.currentTarget?.setPointerCapture?.(e.pointerId);
          }
        } catch (_) {}

        const pt = getCanvasPoint(e);
        const currentObjs = drawnObjectsRef.current;

        // 1. SELECT / MOVE / RESIZE / ROTATE / ANCHOR EDIT / MARQUEE
        if (tool === 'select') {
          if (editableSelectedObjs.length === 1 && editableSelectedObj && !e.shiftKey) {
            if (editableSelectedObj.kind === 'bezier' && editableSelectedObj.nodes) {
              for (let i = 0; i < editableSelectedObj.nodes.length; i++) {
                const n = editableSelectedObj.nodes[i];
                if (Math.hypot(pt.x - n.hOut.x, pt.y - n.hOut.y) <= 10) {
                  interactionRef.current = {
                    mode: 'edit-bezier-handle',
                    objId: editableSelectedObj.id,
                    nodeIdx: i,
                    handleType: 'hOut',
                  };
                  return;
                }
                if (Math.hypot(pt.x - n.hIn.x, pt.y - n.hIn.y) <= 10) {
                  interactionRef.current = {
                    mode: 'edit-bezier-handle',
                    objId: editableSelectedObj.id,
                    nodeIdx: i,
                    handleType: 'hIn',
                  };
                  return;
                }
                if (Math.hypot(pt.x - n.x, pt.y - n.y) <= 10) {
                  interactionRef.current = {
                    mode: 'edit-bezier-anchor',
                    objId: editableSelectedObj.id,
                    nodeIdx: i,
                    startPt: pt,
                    origNode: JSON.parse(JSON.stringify(n)),
                  };
                  return;
                }
              }
            }
          }

          // Rotation & 8 Resize Handles
          if (editableSelectedObjs.length > 0 && !e.shiftKey) {
            const b = getCombinedBounds(editableSelectedObjs);
            const rotH = getRotationHandle(b);
            if (Math.hypot(pt.x - rotH.x, pt.y - rotH.y) <= 12) {
              const origMap = {};
              editableSelectedObjs.forEach((o) => {
                origMap[o.id] = JSON.parse(JSON.stringify(o));
              });
              interactionRef.current = {
                mode: 'rotate',
                cx: b.cx,
                cy: b.cy,
                startPt: pt,
                origObjsMap: origMap,
              };
              return;
            }

            const handles = getResizeHandles(b);
            for (const h of handles) {
              if (Math.hypot(pt.x - h.x, pt.y - h.y) <= 11) {
                const origMap = {};
                editableSelectedObjs.forEach((o) => {
                  origMap[o.id] = JSON.parse(JSON.stringify(o));
                });
                interactionRef.current = {
                  mode: 'resize',
                  handle: h.id,
                  origBounds: b,
                  origObjsMap: origMap,
                };
                return;
              }
            }
          }

          // Hit test editable user objects top-to-bottom
          for (let i = currentObjs.length - 1; i >= 0; i--) {
            const candidate = currentObjs[i];
            if (candidate.isBaseLayer || candidate.visible === false || candidate.locked) {
              continue;
            }
            if (hitTestObject(pt, candidate)) {
              if (e.shiftKey) {
                toggleObjectInSelection(candidate.id);
                return;
              }

              const isAlreadyInMulti = activeSelectionIds.includes(candidate.id);
              const targetIds =
                isAlreadyInMulti && editableSelectedObjs.length > 1
                  ? editableSelectedObjs.map((o) => o.id)
                  : [candidate.id];

              if (!isAlreadyInMulti) {
                selectSingleObject(candidate.id);
              } else {
                setSelectedObjId(candidate.id);
              }

              const leaf =
                candidate.kind === 'group' && candidate.children?.length
                  ? candidate.children[0]
                  : candidate;
              if (leaf) {
                if (leaf.strokeWidth) setBlackStrokeWidth(leaf.strokeWidth);
                if (leaf.strokeColor) {
                  setStrokeColor(leaf.strokeColor);
                  if (leaf.strokeColor !== 'none') setLastSolidStrokeColor(leaf.strokeColor);
                }
                if (leaf.fillColor) {
                  setFillColor(leaf.fillColor);
                  if (leaf.fillColor !== 'none') setLastSolidFillColor(leaf.fillColor);
                }
                setDrawStyleMode(getObjectStyleMode(leaf));
                syncPickerFromHex(
                  activeColorTarget === 'fill'
                    ? leaf.fillColor || 'none'
                    : leaf.strokeColor || 'none'
                );
              }

              const origMap = {};
              currentObjs.forEach((o) => {
                if (targetIds.includes(o.id)) {
                  origMap[o.id] = JSON.parse(JSON.stringify(o));
                }
              });

              interactionRef.current = {
                mode: 'move',
                startPt: pt,
                origObjsMap: origMap,
              };
              return;
            }
          }

          // Drag inside combined selection box to move all selected objects together
          if (editableSelectedObjs.length > 1 && !e.shiftKey) {
            const b = getCombinedBounds(editableSelectedObjs);
            if (pt.x >= b.minX && pt.x <= b.maxX && pt.y >= b.minY && pt.y <= b.maxY) {
              const origMap = {};
              editableSelectedObjs.forEach((o) => {
                origMap[o.id] = JSON.parse(JSON.stringify(o));
              });
              interactionRef.current = {
                mode: 'move',
                startPt: pt,
                origObjsMap: origMap,
              };
              return;
            }
          }

          // Empty space -> Marquee Drag Selection
          const baseSelection = e.shiftKey ? activeSelectionIds : [];
          if (!e.shiftKey) {
            selectSingleObject(null);
          }
          setMarqueeBox({ minX: pt.x, minY: pt.y, maxX: pt.x, maxY: pt.y });
          interactionRef.current = {
            mode: 'marquee-select',
            startPt: pt,
            baseSelection,
          };
          return;
        }

        // 2. BEZIER PEN TOOL
        if (tool === 'bezier') {
          if (activeBezierNodes.length >= 2) {
            const first = activeBezierNodes[0];
            if (Math.hypot(pt.x - first.x, pt.y - first.y) <= 14) {
              finalizeBezierPath(true);
              return;
            }
          }
          const newNode = {
            x: pt.x,
            y: pt.y,
            hIn: { x: pt.x, y: pt.y },
            hOut: { x: pt.x, y: pt.y },
          };
          const nextNodes = [...activeBezierNodes, newNode];
          setActiveBezierNodes(nextNodes);
          interactionRef.current = {
            mode: 'bezier-drag-new-handle',
            nodeIdx: nextNodes.length - 1,
          };
          return;
        }

        // 3. ERASER TOOL (Preserves Base Layers & Locked Layers)
        if (tool === 'eraser') {
          for (let i = currentObjs.length - 1; i >= 0; i--) {
            const candidate = currentObjs[i];
            if (candidate.isBaseLayer || candidate.visible === false || candidate.locked) {
              continue;
            }
            if (hitTestObject(pt, candidate)) {
              const next = currentObjs.filter((_, idx) => idx !== i);
              updateDrawnObjects(next);
              commitHistory(next);
              return;
            }
          }
          return;
        }

        // 4. FREEHAND TOOL (선 / 면 / 선+면)
        const createdObjId = `obj-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
        const resolvedStroke =
          drawStyleMode === 'fill' ? 'none' : resolveSolidStroke(strokeColor);
        const resolvedFill =
          drawStyleMode === 'stroke' ? 'none' : resolveSolidFill(fillColor);
        const userCount = currentObjs.filter((o) => !o.isBaseLayer).length;

        const createdObj = {
          id: createdObjId,
          name: `자유그리기 #${userCount + 1}`,
          kind: 'freehand',
          points: [pt],
          strokeColor: resolvedStroke,
          strokeWidth: blackStrokeWidth,
          fillColor: resolvedFill,
          closed: false,
          visible: true,
          locked: false,
        };

        const next = insertNewUserObject(currentObjs, createdObj);
        updateDrawnObjects(next);
        interactionRef.current = {
          mode: 'freehand-draw',
          objId: createdObjId,
        };
      };

      const handlePointerMove = (e) => {
        const pt = getCanvasPoint(e);
        setHoverCanvasPt(pt);
        const inter = interactionRef.current;

        // Smart hover cursor in select mode when idle
        if (!inter || inter.mode === 'none') {
          if (tool === 'select') {
            let nextCursor = 'default';
            if (editableSelectedObjs.length === 1 && editableSelectedObj?.kind === 'bezier') {
              const hitBezierCtrl = (editableSelectedObj.nodes || []).some(
                (n) =>
                  Math.hypot(pt.x - n.x, pt.y - n.y) <= 10 ||
                  Math.hypot(pt.x - n.hIn.x, pt.y - n.hIn.y) <= 10 ||
                  Math.hypot(pt.x - n.hOut.x, pt.y - n.hOut.y) <= 10
              );
              if (hitBezierCtrl) {
                setCanvasCursor('pointer');
                return;
              }
            }

            if (editableSelectedObjs.length > 0) {
              const b = getCombinedBounds(editableSelectedObjs);
              const rotH = getRotationHandle(b);
              if (Math.hypot(pt.x - rotH.x, pt.y - rotH.y) <= 12) {
                setCanvasCursor('grab');
                return;
              }
              const handles = getResizeHandles(b);
              const cursorMap = {
                nw: 'nwse-resize',
                se: 'nwse-resize',
                ne: 'nesw-resize',
                sw: 'nesw-resize',
                n: 'ns-resize',
                s: 'ns-resize',
                e: 'ew-resize',
                w: 'ew-resize',
              };
              for (const h of handles) {
                if (Math.hypot(pt.x - h.x, pt.y - h.y) <= 11) {
                  setCanvasCursor(cursorMap[h.id] || 'pointer');
                  return;
                }
              }
              if (
                editableSelectedObjs.length > 1 &&
                pt.x >= b.minX &&
                pt.x <= b.maxX &&
                pt.y >= b.minY &&
                pt.y <= b.maxY
              ) {
                setCanvasCursor('move');
                return;
              }
            }

            const currentObjs = drawnObjectsRef.current;
            for (let i = currentObjs.length - 1; i >= 0; i--) {
              const candidate = currentObjs[i];
              if (candidate.isBaseLayer || candidate.visible === false || candidate.locked) {
                continue;
              }
              if (hitTestObject(pt, candidate)) {
                nextCursor = 'move';
                break;
              }
            }
            setCanvasCursor(nextCursor);
          }
          return;
        }

        if (inter.mode === 'bezier-drag-new-handle') {
          setActiveBezierNodes((prev) =>
            prev.map((n, idx) => {
              if (idx !== inter.nodeIdx) return n;
              const dx = pt.x - n.x;
              const dy = pt.y - n.y;
              return {
                ...n,
                hOut: { x: n.x + dx, y: n.y + dy },
                hIn: { x: n.x - dx, y: n.y - dy },
              };
            })
          );
          return;
        }

        if (inter.mode === 'freehand-draw') {
          let changed = false;
          const next = drawnObjectsRef.current.map((o) => {
            if (o.id !== inter.objId) return o;
            const pts = o.points || [];
            const last = pts[pts.length - 1];
            if (last && Math.hypot(pt.x - last.x, pt.y - last.y) < 2.5) return o;
            changed = true;
            return { ...o, points: [...pts, pt] };
          });
          if (changed) updateDrawnObjects(next);
          return;
        }

        if (inter.mode === 'move') {
          const dx = pt.x - inter.startPt.x;
          const dy = pt.y - inter.startPt.y;
          const origMap = inter.origObjsMap || {};
          const next = drawnObjectsRef.current.map((o) => {
            const orig = origMap[o.id];
            if (!orig) return o;
            return translateVectorObj(orig, dx, dy);
          });
          updateDrawnObjects(next);
          return;
        }

        if (inter.mode === 'marquee-select') {
          const minX = Math.min(inter.startPt.x, pt.x);
          const maxX = Math.max(inter.startPt.x, pt.x);
          const minY = Math.min(inter.startPt.y, pt.y);
          const maxY = Math.max(inter.startPt.y, pt.y);
          setMarqueeBox({ minX, minY, maxX, maxY });

          if (Math.hypot(pt.x - inter.startPt.x, pt.y - inter.startPt.y) > 3) {
            const hitIds = drawnObjectsRef.current
              .filter((obj) => {
                if (obj.isBaseLayer || obj.visible === false || obj.locked) return false;
                const b = getObjectBounds(obj);
                return !(
                  b.maxX < minX ||
                  b.minX > maxX ||
                  b.maxY < minY ||
                  b.minY > maxY
                );
              })
              .map((o) => o.id);

            const combined = Array.from(
              new Set([...(inter.baseSelection || []), ...hitIds])
            );
            setSelectedObjIds(combined);
            setSelectedObjId(combined[combined.length - 1] || null);
          }
          return;
        }

        if (inter.mode === 'rotate') {
          setCanvasCursor('grabbing');
          const startAngle = Math.atan2(
            inter.startPt.y - inter.cy,
            inter.startPt.x - inter.cx
          );
          const currAngle = Math.atan2(pt.y - inter.cy, pt.x - inter.cx);
          let delta = currAngle - startAngle;
          if (e.shiftKey) {
            const snap = Math.PI / 12; // 15-degree snap
            delta = Math.round(delta / snap) * snap;
          }
          const cos = Math.cos(delta);
          const sin = Math.sin(delta);
          const mapPt = (p) => {
            const rx = p.x - inter.cx;
            const ry = p.y - inter.cy;
            return {
              x: inter.cx + rx * cos - ry * sin,
              y: inter.cy + rx * sin + ry * cos,
            };
          };
          const origMap = inter.origObjsMap || {};
          const next = drawnObjectsRef.current.map((o) => {
            const orig = origMap[o.id];
            if (!orig) return o;
            return mapVectorObjPoints(orig, mapPt);
          });
          updateDrawnObjects(next);
          return;
        }

        if (inter.mode === 'resize') {
          const { origBounds: b, origObjsMap, handle } = inter;
          let newMinX = b.minX;
          let newMaxX = b.maxX;
          let newMinY = b.minY;
          let newMaxY = b.maxY;

          if (handle.includes('w')) newMinX = Math.min(pt.x, b.maxX - 10);
          if (handle.includes('e')) newMaxX = Math.max(pt.x, b.minX + 10);
          if (handle.includes('n')) newMinY = Math.min(pt.y, b.maxY - 10);
          if (handle.includes('s')) newMaxY = Math.max(pt.y, b.minY + 10);

          let scaleX = b.width > 0 ? (newMaxX - newMinX) / b.width : 1;
          let scaleY = b.height > 0 ? (newMaxY - newMinY) / b.height : 1;

          if (e.shiftKey && handle.length === 2) {
            const uniform = Math.max(scaleX, scaleY);
            scaleX = uniform;
            scaleY = uniform;
            const targetW = b.width * uniform;
            const targetH = b.height * uniform;
            if (handle.includes('w')) newMinX = b.maxX - targetW;
            else newMaxX = b.minX + targetW;
            if (handle.includes('n')) newMinY = b.maxY - targetH;
            else newMaxY = b.minY + targetH;
          }

          const mapPt = (p) => ({
            x: newMinX + (p.x - b.minX) * scaleX,
            y: newMinY + (p.y - b.minY) * scaleY,
          });

          const next = drawnObjectsRef.current.map((o) => {
            const orig = origObjsMap?.[o.id];
            if (!orig) return o;
            return mapVectorObjPoints(orig, mapPt);
          });
          updateDrawnObjects(next);
          return;
        }

        if (inter.mode === 'edit-bezier-anchor') {
          const dx = pt.x - inter.startPt.x;
          const dy = pt.y - inter.startPt.y;
          const origN = inter.origNode;
          const next = drawnObjectsRef.current.map((o) => {
            if (o.id !== inter.objId) return o;
            return {
              ...o,
              nodes: o.nodes.map((n, idx) =>
                idx !== inter.nodeIdx
                  ? n
                  : {
                      x: origN.x + dx,
                      y: origN.y + dy,
                      hIn: { x: origN.hIn.x + dx, y: origN.hIn.y + dy },
                      hOut: { x: origN.hOut.x + dx, y: origN.hOut.y + dy },
                    }
              ),
            };
          });
          updateDrawnObjects(next);
          return;
        }

        if (inter.mode === 'edit-bezier-handle') {
          const next = drawnObjectsRef.current.map((o) => {
            if (o.id !== inter.objId) return o;
            return {
              ...o,
              nodes: o.nodes.map((n, idx) => {
                if (idx !== inter.nodeIdx) return n;
                const dx = pt.x - n.x;
                const dy = pt.y - n.y;
                if (inter.handleType === 'hOut') {
                  return {
                    ...n,
                    hOut: { x: pt.x, y: pt.y },
                    hIn: { x: n.x - dx, y: n.y - dy },
                  };
                }
                return {
                  ...n,
                  hIn: { x: pt.x, y: pt.y },
                  hOut: { x: n.x - dx, y: n.y - dy },
                };
              }),
            };
          });
          updateDrawnObjects(next);
        }
      };

      const handlePointerUp = (e) => {
        const mode = interactionRef.current.mode;
        interactionRef.current = { mode: 'none' };
        try {
          if (e?.pointerId != null) {
            e.currentTarget?.releasePointerCapture?.(e.pointerId);
          }
        } catch (_) {}

        if (mode === 'marquee-select') {
          setMarqueeBox(null);
          return;
        }
        if (
          [
            'freehand-draw',
            'move',
            'resize',
            'rotate',
            'edit-bezier-anchor',
            'edit-bezier-handle',
          ].includes(mode)
        ) {
          commitHistory(drawnObjectsRef.current);
        }
      };

      // ========================================================================
      // INTERACTIVE 510 x 480 CANVAS RENDERER (2x HiDPI for Crisp Large Workspace)
      // ========================================================================
      useEffect(() => {
        const canvas = drawCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, CANVAS_W * 2, CANVAS_H * 2);
        ctx.setTransform(2, 0, 0, 2, 0, 0);

        const drawObjectOnCtx = (obj) => {
          if (!obj || obj.visible === false) return;
          if (obj.kind === 'base-clothes' || obj.kind === 'base-face') {
            if (!customGuideDataUrl) {
              drawBaseLayerOnCtx(ctx, obj.kind, guideOpacity);
            }
            return;
          }
          if (obj.kind === 'group' && obj.children) {
            obj.children.forEach(drawObjectOnCtx);
            return;
          }
          const d =
            obj.kind === 'bezier'
              ? bezierNodesToSvgPath(obj.nodes, Boolean(obj.closed))
              : pointsToSvgPath(obj.points, Boolean(obj.closed));
          if (!d) return;
          const path2d = new Path2D(d);
          if (obj.fillColor && obj.fillColor !== 'none') {
            ctx.fillStyle = obj.fillColor;
            ctx.fill(path2d);
          }
          if (obj.strokeColor && obj.strokeColor !== 'none' && obj.strokeWidth > 0) {
            ctx.strokeStyle = obj.strokeColor;
            ctx.lineWidth = obj.strokeWidth;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke(path2d);
          }
        };

        const activePreviewObj =
          activeBezierNodes.length > 0
            ? {
                kind: 'bezier',
                nodes:
                  hoverCanvasPt && interactionRef.current.mode === 'none'
                    ? [
                        ...activeBezierNodes,
                        {
                          x: hoverCanvasPt.x,
                          y: hoverCanvasPt.y,
                          hIn: { x: hoverCanvasPt.x, y: hoverCanvasPt.y },
                          hOut: { x: hoverCanvasPt.x, y: hoverCanvasPt.y },
                        },
                      ]
                    : activeBezierNodes,
                strokeColor:
                  drawStyleMode === 'fill' ? 'none' : resolveSolidStroke(strokeColor),
                strokeWidth: blackStrokeWidth,
                fillColor:
                  drawStyleMode === 'stroke' ? 'none' : resolveSolidFill(fillColor),
                closed: false,
                visible: true,
              }
            : null;

        let drewActivePreview = false;
        drawnObjects.forEach((obj) => {
          if (
            activePreviewObj &&
            !drewActivePreview &&
            drawInsertPos === 'behind-clothes' &&
            obj.kind === 'base-clothes'
          ) {
            drawObjectOnCtx(activePreviewObj);
            drewActivePreview = true;
          }
          drawObjectOnCtx(obj);
        });

        if (activePreviewObj && !drewActivePreview) {
          drawObjectOnCtx(activePreviewObj);
        }

        // Active in-progress Bezier anchors & handles always on top for easy control
        if (activeBezierNodes.length > 0) {
          activeBezierNodes.forEach((n, idx) => {
            ctx.save();
            ctx.strokeStyle = '#EC4899';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(n.hIn.x, n.hIn.y);
            ctx.lineTo(n.x, n.y);
            ctx.lineTo(n.hOut.x, n.hOut.y);
            ctx.stroke();

            [n.hIn, n.hOut].forEach((h) => {
              ctx.fillStyle = '#EC4899';
              ctx.beginPath();
              ctx.arc(h.x, h.y, 4.5, 0, Math.PI * 2);
              ctx.fill();
            });

            ctx.fillStyle = idx === 0 ? '#FACC15' : '#FFFFFF';
            ctx.strokeStyle = '#1E293B';
            ctx.lineWidth = 2;
            ctx.fillRect(n.x - 5, n.y - 5, 10, 10);
            ctx.strokeRect(n.x - 5, n.y - 5, 10, 10);
            ctx.restore();
          });
        }

        // Selection Bounding Box, Rotation Handle, 8 Resize Handles & Bezier Anchors
        if (tool === 'select' && editableSelectedObjs.length > 0) {
          const b = getCombinedBounds(editableSelectedObjs);
          const isGroupOrMulti =
            editableSelectedObjs.length > 1 || editableSelectedObjs[0]?.kind === 'group';
          const boxColor = isGroupOrMulti ? '#7C3AED' : '#2563EB';

          ctx.save();
          if (editableSelectedObjs.length > 1) {
            ctx.strokeStyle = 'rgba(79, 70, 229, 0.45)';
            ctx.lineWidth = 1.25;
            ctx.setLineDash([3, 3]);
            editableSelectedObjs.forEach((sub) => {
              const sb = getObjectBounds(sub);
              ctx.strokeRect(sb.minX, sb.minY, sb.width, sb.height);
            });
          } else if (
            editableSelectedObjs[0]?.kind === 'group' &&
            editableSelectedObjs[0].children
          ) {
            ctx.strokeStyle = 'rgba(139, 92, 246, 0.4)';
            ctx.lineWidth = 1.25;
            ctx.setLineDash([3, 3]);
            editableSelectedObjs[0].children.forEach((ch) => {
              const sb = getObjectBounds(ch);
              ctx.strokeRect(sb.minX, sb.minY, sb.width, sb.height);
            });
          }

          ctx.strokeStyle = boxColor;
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.strokeRect(b.minX, b.minY, b.width, b.height);
          ctx.setLineDash([]);

          // Rotation Stem & Circle Handle
          const rotHandle = getRotationHandle(b);
          ctx.beginPath();
          ctx.moveTo(b.cx, b.minY);
